<style>
/* Layout: single-column phone app, sticky header, fixed bottom tab bar; muscle colours carry the colour, UI chrome stays iron grey */
:root {
  --bg: #eef0f2; --surface: #ffffff; --surface-2: #e4e7eb; --fg: #14171c; --muted: #5a616d; --line: #d3d7dd;
  --ink: #14171c; --on-ink: #f6f7f8;
  --good: #1d8148; --warn: #a86a12; --bad: #b8322a;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #22262d; --fg: #eceef1; --muted: #9aa1ac; --line: #2b3038;
  --ink: #eceef1; --on-ink: #121418; --good: #3fbf74; --warn: #e0a43c; --bad: #ef6a5f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #22262d; --fg: #eceef1; --muted: #9aa1ac; --line: #2b3038;
  --ink: #eceef1; --on-ink: #121418; --good: #3fbf74; --warn: #e0a43c; --bad: #ef6a5f; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 18px; font-weight: 600; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { max-width: 760px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top .brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.plate { width: 22px; height: 22px; border-radius: 50%; border: 5px solid var(--fg); position: relative; }
.plate::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--fg); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--good); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 10px; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
nav.tabs .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card.flat { background: transparent; border-style: dashed; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; min-height: 40px; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger, .link.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; flex: none; font-weight: 700; font-size: 18px; line-height: 1; }
.iconbtn.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-height: 40px; }
textarea { resize: vertical; min-height: 64px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Muscle chips: group = solid, sub-category = mid shade, muscle = light tint */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--ink); color: var(--on-ink); }
.chip.tier { background: transparent; border-color: var(--c); color: var(--fg); }
.chip.tier::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip.tier[aria-pressed="true"] { background: var(--c); color: var(--t); }
.chip.tier[aria-pressed="true"]::before { background: var(--t); opacity: .7; }
.chip.t2 { font-size: 12.5px; }
.chip.t3 { font-size: 12px; padding: 4px 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; background: var(--c, var(--surface-2)); color: var(--t, var(--fg)); white-space: nowrap; }
.pill.out { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.dotc { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }

.search { position: relative; }
.search input { padding-left: 36px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }

.exlist { display: flex; flex-direction: column; gap: 8px; }
.ex { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 10px 0; overflow: hidden; }
.ex .strip { align-self: stretch; display: flex; flex-direction: column; margin: -10px 0; }
.ex .strip i { flex: 1; }
.ex .body { min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.ex .name { font-weight: 600; font-size: 15.5px; }
.ex .meta { font-size: 12.5px; color: var(--muted); }
.ex .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.rec { font-family: var(--font-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.bar { height: 8px; background: var(--surface-2); border-radius: 999px; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 999px; }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; color: var(--muted); font-weight: 600; }

.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
.heat i { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); }
.heat i.on { background: var(--good); }
.heat i.today { outline: 1.5px solid var(--fg); outline-offset: -1.5px; }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--fg); opacity: .07; }
.chart .pt { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
.chart .tg { stroke: var(--good); stroke-dasharray: 4 4; stroke-width: 1.5; }

/* Coach chat */
.coach { background: var(--ink); color: var(--on-ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.coach .bubble { background: color-mix(in srgb, var(--on-ink) 10%, transparent); border-radius: 12px 12px 12px 4px; padding: 9px 12px; font-size: 14px; max-width: 92%; }
.coach .bubble.me { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: color-mix(in srgb, var(--on-ink) 22%, transparent); }
.coach textarea { background: color-mix(in srgb, var(--on-ink) 8%, transparent); color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 25%, transparent); min-height: 54px; }
.coach textarea::placeholder { color: color-mix(in srgb, var(--on-ink) 55%, transparent); }
.coach .btn.primary { background: var(--on-ink); color: var(--ink); border-color: var(--on-ink); }
.coach .btn.ghost { color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 30%, transparent); }
.coach .ideas { display: flex; gap: 6px; flex-wrap: wrap; }
.coach .ideas button { background: transparent; border: 1px solid color-mix(in srgb, var(--on-ink) 30%, transparent); color: var(--on-ink); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; text-align: left; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg label { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.sugg input { width: 18px; height: 18px; accent-color: var(--fg); }
.sugg .why { font-size: 12.5px; color: var(--muted); }

/* Builder / session */
.block { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.block.ss { border-left: 4px solid var(--fg); }
.block .ss-head { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 9px 12px 0; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.block .ss-head .link { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--muted); }
.bitem { padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.bitem + .bitem { border-top: 1px dashed var(--line); }
.tagid { font-family: var(--font-display); font-weight: 700; font-size: 17px; width: 30px; text-align: center; }
.bitem .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bitem .ctl input { width: 60px; text-align: center; padding: 6px; min-height: 34px; }
.moves { display: flex; flex-direction: column; gap: 4px; }
.moves .iconbtn { width: 32px; height: 30px; font-size: 15px; }
.linker { display: flex; justify-content: center; }
.linker button { font-size: 12px; font-weight: 600; border: 1px dashed var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 3px 12px; }
.sets { display: grid; grid-template-columns: 34px 1fr 1fr 44px; gap: 6px 8px; align-items: center; padding: 0 12px 12px; }
.sets .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; }
.sets input { text-align: center; padding: 7px 4px; min-height: 42px; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.sets .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: center; }
.tick { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); }
.tick svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 3; fill: none; opacity: .25; }
.tick.on { background: var(--good); border-color: var(--good); color: #fff; }
.tick.on svg { opacity: 1; }
.sets .done input { opacity: .6; }
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 31; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); white-space: nowrap; }
.timer .num { font-size: 22px; font-weight: 700; min-width: 50px; }
.timer button { background: color-mix(in srgb, var(--on-ink) 14%, transparent); color: var(--on-ink); border: 0; border-radius: 999px; padding: 6px 10px; font-weight: 600; font-size: 13px; }

/* Programs */
.phases { display: flex; gap: 3px; }
.phases > div { flex: var(--w); min-width: 0; }
.phases .seg-bar { height: 10px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.phases .seg-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.phases .pl { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phases .cur .pl { color: var(--fg); font-weight: 600; }
.progcard { cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.cat { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.mix { display: flex; height: 6px; border-radius: 4px; overflow: hidden; }
.dayex { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.dayex div { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; font-size: 14px; align-items: baseline; }
.dayex .ssl { font-family: var(--font-display); font-weight: 700; color: var(--muted); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.tree { display: flex; flex-direction: column; gap: 10px; }
.tree .g { display: flex; flex-direction: column; gap: 6px; }
.tree .s { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--on-ink); padding: 9px 16px; border-radius: 999px; z-index: 60; font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 22px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.list-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.list-row:first-child { border-top: 0; }
.goal { display: flex; flex-direction: column; gap: 8px; }
.goal + .goal { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist td, table.hist th { padding: 7px 6px; border-top: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
table.hist th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
.tablewrap { overflow-x: auto; }
details summary { cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }
</style>

}
function lastSets(exId) { const h = exHistory(exId); return h.length ? h[h.length - 1] : null; }

  const pool = EXERCISES.filter(e => (!P.allow.size || P.allow.has(e.equipment)) && !P.deny.has(e.equipment) && (!P.compoundOnly || e.type === 'compound') && (!P.isoOnly || e.type === 'isolation'));

      if (used.has(e.id)) return;

      if (['conditioning', 'olympic', 'plyo'].includes(e.pattern) && P.style !== 'endurance' && !P.tagWords.some(w => w === 'explosive' || w === 'olympic' || w === 'athletic')) s -= 4;

}

  h += logs.length ? `<div class="card">${logs.slice().reverse().slice(0, 40).map(l => { const sets = l.items.reduce((n, i) => n + i.sets.length, 0); const gs = [...new Set(l.items.flatMap(i => EX[i.exId] ? [EX[i.exId].primaryGroup] : []))]; return `<div class="list-row"><div style="min-width:0"><strong>${esc(l.name)}</strong><div class="small muted">${fmtDL(l.date)} · ${l.items.length} exercises · ${sets} sets${l.programId && PROG[l.programId] ? ' · ' + esc(PROG[l.programId].name) : ''}</div><div class="chips" style="margin-top:4px">${gs.map(gPill).join('')}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-act="repeatLog" data-id="${l.id}">Repeat</button><button class="btn sm ghost danger" data-act="delLog" data-id="${l.id}" aria-label="Delete workout">×</button></div></div>`; }).join('')}</div>` : `<div class="card flat empty small muted">Your finished workouts will be listed here.</div>`;
  return h + '</div>';
}

// ---------- sheets ----------
function openSheet(html) { $('#sheet').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }
let pendingConfirm = null;
function confirmSheet(title, body, onYes, yesLabel = 'Confirm') {
  pendingConfirm = onYes;
  openSheet(`<div class="sheet-head"><h2>${esc(title)}</h2></div><div class="stack"><div class="muted">${esc(body)}</div>${onYes ? `<button class="btn primary block" data-act="confirmYes">${esc(yesLabel)}</button><button class="btn block" data-act="closeSheet">Cancel</button>` : `<button class="btn primary block" data-act="closeSheet">OK</button>`}</div>`);
}
function bwSheet() {
  const b = latestBW();
  openSheet(`<div class="sheet-head"><h2>Log body weight</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <form class="stack" data-form="bw"><div class="row"><div class="field"><label class="label" for="bwKg">Weight (${unit()})</label><input id="bwKg" type="number" inputmode="decimal" step="0.1" required value="${b ? b.kg : ''}"></div><div class="field"><label class="label" for="bwDate">Date</label><input id="bwDate" type="date" value="${today()}"></div></div><button class="btn primary block" type="submit">Save</button></form>
   ${state.bodyweight.length ? `<div class="card" style="margin-top:14px">${state.bodyweight.slice().reverse().slice(0, 8).map(x => `<div class="list-row"><span>${fmtDL(x.date)}</span><span class="row" style="gap:8px;flex-wrap:nowrap"><strong class="num" style="font-size:17px">${round1(x.kg)} ${unit()}</strong><button class="btn sm ghost danger" data-act="delBW" data-d="${x.date}" aria-label="Delete entry">×</button></span></div>`).join('')}</div>` : ''}`);
}
function goalSheet() {
  const exOpts = EXERCISES.filter(e => e.type === 'compound' && ['barbell', 'dumbbell', 'trap-bar', 'machine', 'bodyweight', 'smith', 'landmine'].includes(e.equipment)).sort((a, b) => (lastSets(b.id) ? 1 : 0) - (lastSets(a.id) ? 1 : 0) || a.name.localeCompare(b.name));
  openSheet(`<div class="sheet-head"><h2>New goal</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <form class="stack" data-form="goal">
    <div class="field"><label class="label" for="gType">Type</label><select id="gType" data-input="gType"><option value="bodyweight">Reach a body weight</option><option value="lift">Lift a weight</option><option value="attendance">Train X days a week</option><option value="custom">Something else I can measure</option></select></div>
    <div class="field" id="gExWrap" hidden><label class="label" for="gEx">Exercise</label><select id="gEx">${exOpts.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
    <div class="field" id="gTitleWrap" hidden><label class="label" for="gTitle">Goal name</label><input id="gTitle" type="text" placeholder="e.g. Run 5 km under 25 min"></div>
    <div class="row"><div class="field" id="gStartWrap" hidden><label class="label" for="gStart">Starting value</label><input id="gStart" type="number" step="0.1" inputmode="decimal"></div><div class="field"><label class="label" for="gTarget" id="gTargetLabel">Target (${unit()})</label><input id="gTarget" type="number" step="0.1" inputmode="decimal" required></div><div class="field" id="gUnitWrap" hidden><label class="label" for="gUnit">Unit</label><input id="gUnit" type="text" placeholder="min, km, reps"></div></div>
    <div class="field"><label class="label" for="gDeadline">Deadline (optional)</label><input id="gDeadline" type="date"></div>
    <button class="btn primary block" type="submit">Add goal</button></form>`);
}
function goalTypeChanged() {
  const t = $('#gType').value;
  $('#gExWrap').hidden = t !== 'lift'; $('#gTitleWrap').hidden = t !== 'custom'; $('#gStartWrap').hidden = t !== 'custom'; $('#gUnitWrap').hidden = t !== 'custom';
  $('#gTargetLabel').textContent = t === 'attendance' ? 'Days per week' : t === 'custom' ? 'Target' : `Target (${unit()})`;
}
function goalUpdateSheet(id) {
  const g = state.goals.find(x => x.id === id); if (!g) return;
  const p = goalProgress(g), auto = g.type !== 'custom';
  openSheet(`<div class="sheet-head"><div><div class="label">${p.pct}% there</div><h2>${esc(g.title)}</h2></div><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <div class="stack"><div class="card">${goalRow(g, false)}</div>
    <form class="stack card" data-form="goalUpd" data-id="${id}">
      ${auto ? `<div class="small muted">${g.type === 'bodyweight' ? 'Progress updates from your body weight log.' : g.type === 'lift' ? 'Progress updates from your heaviest logged set.' : 'Progress updates from the days you train.'} Add a note or change the target here.</div>` : `<div class="field"><label class="label" for="guVal">New value${g.unit ? ' (' + esc(g.unit) + ')' : ''}</label><input id="guVal" type="number" step="0.1" inputmode="decimal"></div>`}
      <div class="field"><label class="label" for="guNote">Note</label><input id="guNote" type="text" placeholder="How is it going?"></div>
      <div class="field"><label class="label" for="guTarget">Target</label><input id="guTarget" type="number" step="0.1" value="${esc(g.target)}"></div>
      <button class="btn primary block" type="submit">Save update</button></form>
    ${g.history.length ? `<div class="card"><div class="label">History</div>${g.history.slice().reverse().map(x => `<div class="list-row"><div><div class="small muted">${fmtDL(x.d)}</div>${x.note ? esc(x.note) : ''}</div>${x.v !== '' && x.v != null ? `<strong class="num" style="font-size:17px">${round1(+x.v)}</strong>` : ''}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn" style="flex:1" data-act="goalDone" data-id="${id}">${g.done ? 'Reopen goal' : 'Mark complete'}</button><button class="btn ghost danger" style="flex:1" data-act="goalDel" data-id="${id}">Delete</button></div></div>`);
}
function settingsSheet() {
  openSheet(`<div class="sheet-head"><h2>Settings</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <div class="stack"><div class="card stack" style="gap:8px"><div class="row between"><span>Weight unit</span><div class="seg"><button data-act="unitSet" data-v="kg" aria-pressed="${unit() === 'kg'}">kg</button><button data-act="unitSet" data-v="lb" aria-pressed="${unit() === 'lb'}">lb</button></div></div><div class="small muted">Changes the label only. Numbers you have logged stay as entered.</div></div>
   <div class="card small"><strong>Where your data lives</strong><div class="muted">${Store.mode === 'account' ? 'Saved to your account, so it is there on any device where you open this app signed in.' : STANDALONE ? 'Saved on this phone only. Make a backup now and then so you can restore it if you change phones or clear your browser.' : 'Saved in this browser only. Open the app signed in to keep it on your account.'}</div>
   ${STANDALONE ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-act="backup">Download backup</button><label class="btn sm" for="restoreFile" style="cursor:pointer">Restore from backup</label><input type="file" id="restoreFile" accept="application/json,.json" hidden></div>` : ''}</div>
   <div class="card small"><strong>Library</strong><div class="muted">${EXERCISES.length} exercises across ${TAX.groups.length} muscle groups, ${Object.keys(SG).length} sub-categories and ${Object.keys(M).length} muscles. ${PROGRAMS.length} programs.</div><div class="chips" style="margin-top:8px">${TAX.groups.map(g => gPill(g.id)).join('')}</div></div>
   <button class="btn ghost danger block" data-act="resetAll">Delete all my data</button></div>`);
}
function pickExerciseSheet() {
  openSheet(`<div class="sheet-head"><h2>Add exercise</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <div class="stack"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" id="pickQ" placeholder="Search exercises or muscles" data-input="pickQ" autocomplete="off"></div><div id="pickList" class="stack" style="gap:6px"></div></div>`);
  renderPick('');
}
function renderPick(q) {
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  $('#pickList').innerHTML = EXERCISES.filter(e => w.every(x => e._s.includes(x))).slice(0, 40).map(e => `<button class="btn block" style="justify-content:space-between;text-align:left" data-act="sessPick" data-id="${e.id}"><span>${esc(e.name)}</span><span class="row" style="gap:4px;flex-wrap:nowrap">${e.groups.slice(0, 3).map(g => `<span class="dotc" style="background:${G[g].color}"></span>`).join('')}</span></button>`).join('');
}

// ---------- actions ----------
const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
function removeAt(items, i) { if (i > 0 && items[i - 1].link && !items[i].link) items[i - 1].link = false; items.splice(i, 1); }
const A = {
  tab: d => go(d.id), closeSheet: () => closeSheet(), scrim: (d, el, ev) => { if (ev.target === el) closeSheet(); },
  selG: d => { toggle(ui.selG, d.id); if (!ui.selG.has(d.id)) G[d.id].subgroups.forEach(s => { ui.selSG.delete(s.id); s.muscles.forEach(m => ui.selM.delete(m.id)); }); render(); },
  selSG: d => { toggle(ui.selSG, d.id); if (!ui.selSG.has(d.id)) SG[d.id].muscles.forEach(m => ui.selM.delete(m.id)); render(); },
  selM: d => { toggle(ui.selM, d.id); render(); },
  match: d => { ui.match = d.v; render(); }, scope: d => { ui.scope = d.v; render(); }, more: () => { ui.showMore = !ui.showMore; render(); },
  equip: d => { toggle(ui.equip, d.id); render(); }, type: d => { ui.type = d.v; render(); },
  clearFilters: () => { ui.selG.clear(); ui.selSG.clear(); ui.selM.clear(); ui.equip.clear(); ui.type = 'all'; ui.q = ''; render(); },
  cycleStyle: () => { const o = ['hypertrophy', 'strength', 'endurance']; state.settings.goalStyle = o[(o.indexOf(state.settings.goalStyle) + 1) % 3]; saveState(); render(); },
  setStyle: d => { state.settings.goalStyle = d.v; saveState(); render(); },
  exDetail: d => exDetail(d.id),
  addEx: d => {
    if (state.active) return toast('Add exercises from the workout screen');
    const i = state.draft.items.findIndex(x => x.exId === d.id);
    if (i >= 0) { removeAt(state.draft.items, i); toast('Removed from workout'); }
    else { const r = parseRec(recFor(EX[d.id])); state.draft.items.push({ exId: d.id, sets: r.sets, reps: r.reps, link: false }); toast(`Added · ${state.draft.items.length} in your workout`); }
    saveState(); if (d.close) closeSheet(); if (ui.tab === 'exercises') renderExList(); else render();
  },
  clearDraft: () => confirmSheet('Clear this workout?', 'This removes every exercise from the workout you are building.', () => { state.draft = blankDraft(); saveState(); render(); }, 'Clear workout'),
  moveIt: d => { const it = state.draft.items, i = +d.i, j = i + +d.d; if (j < 0 || j >= it.length) return; [it[i], it[j]] = [it[j], it[i]]; it[it.length - 1].link = false; saveState(); render(); },
  rmIt: d => { removeAt(state.draft.items, +d.i); saveState(); render(); },
  link: d => { state.draft.items[+d.i].link = true; saveState(); render(); },
  unlinkBlock: d => { for (let k = +d.i; k <= +d.j; k++) state.draft.items[k].link = false; saveState(); render(); },
  saveTemplate: () => { const d = state.draft; const name = d.name || defaultName(d.items); const items = d.items.map(({ exId, sets, reps, link }) => ({ exId, sets, reps, link })); const ex = state.templates.find(t => t.name === name); if (ex) ex.items = items; else state.templates.push({ id: uid(), name, items }); saveState(); toast(`Saved "${name}"`); render(); },
  loadTemplate: d => { const t = state.templates.find(x => x.id === d.id); state.draft = { name: t.name, items: t.items.map(x => ({ ...x })), programId: null, dayIndex: null }; saveState(); render(); toast('Loaded ' + t.name); },
  delTemplate: d => { const t = state.templates.find(x => x.id === d.id); confirmSheet(`Delete "${t.name}"?`, 'The saved workout is removed. Logged sessions stay.', () => { state.templates = state.templates.filter(x => x.id !== d.id); saveState(); render(); }, 'Delete'); },
  startSession: () => startSession(),
  coachGo: () => runCoach(0),
  coachShuffle: () => { ui.coachText = state.coach?.prompt || ''; runCoach((Date.now() % 100000) + 7); },
  coachIdea: d => { ui.coachText = d.t; runCoach(0); },
  coachAdd: () => {
    const picks = state.coach.items.filter(i => i.pick !== false);
    if (!picks.length) return toast('Tick at least one exercise');
    const have = new Set(state.draft.items.map(i => i.exId));
    picks.forEach((it, k) => { if (!have.has(it.exId)) state.draft.items.push({ exId: it.exId, sets: it.sets, reps: it.reps, link: !!(it.link && picks[k + 1] && state.coach.items.indexOf(picks[k + 1]) === state.coach.items.indexOf(it) + 1) }); });
    if (state.draft.items.length) state.draft.items[state.draft.items.length - 1].link = false;
    if (!state.draft.name) state.draft.name = defaultName(state.draft.items);
    state.coach = null; saveState(); render(); toast(`${picks.length} exercises added`);
  },
  tick: d => { const it = state.active.items[+d.k], s = it.sets[+d.n]; s.done = !s.done; if (s.done && !it.link) ui.timerEnd = Date.now() + ui.timerDur * 1000; saveState(); render(); },
  addSet: d => { const sets = state.active.items[+d.k].sets; const l = sets[sets.length - 1] || { w: '', r: '' }; sets.push({ w: l.w, r: l.r, done: false }); saveState(); render(); },
  rmSet: d => { state.active.items[+d.k].sets.pop(); saveState(); render(); },
  sessRmEx: d => { removeAt(state.active.items, +d.k); saveState(); render(); },
  sessAddEx: () => pickExerciseSheet(),
  sessPick: d => { const r = parseRec(recFor(EX[d.id])), last = lastSets(d.id); state.active.items.push({ exId: d.id, link: false, target: r.reps, sets: Array.from({ length: r.sets }, () => ({ w: last ? last.top : '', r: firstNum(r.reps), done: false })) }); saveState(); closeSheet(); render(); },
  finishSession: () => finishSession(),
  discardSession: () => confirmSheet('Discard this workout?', 'Nothing from this session will be saved.', () => { state.active = null; ui.timerEnd = 0; saveState(true); render(); }, 'Discard'),
  timerDur: d => { ui.timerDur = +d.s; render(); },
  timerAdd: d => { ui.timerEnd = Math.max(Date.now(), ui.timerEnd) + +d.s * 1000; renderTimer(); }, timerStop: () => { ui.timerEnd = 0; renderTimer(); },
  progCat: d => { ui.progCat = d.v; render(); }, progDetail: d => progDetail(d.id),
  startProgram: d => { const start = $('#progStart')?.value || today(); endProgramRecord(); state.program = { id: d.id, start, runId: uid() }; state.draft = blankDraft(); saveState(true); closeSheet(); go('home'); toast('Program started. Good luck!'); },
  endProgram: () => confirmSheet('End this program?', 'It moves to your past programs. Your logged workouts stay.', () => { endProgramRecord(); saveState(true); render(); }, 'End program'),
  loadProgDay: d => { if (state.active) { closeSheet(); go('workout'); return toast('Finish your current workout first'); } loadProgDay(+d.day); },
  bwSheet: () => bwSheet(), goalSheet: () => goalSheet(), goalUpdate: d => goalUpdateSheet(d.id), settings: () => settingsSheet(),
  delBW: d => { state.bodyweight = state.bodyweight.filter(b => b.date !== d.d); saveState(); render(); bwSheet(); },
  goalDone: d => { const g = state.goals.find(x => x.id === d.id); g.done = !g.done; g.history.push({ d: today(), v: '', note: g.done ? 'Marked complete' : 'Reopened' }); saveState(); closeSheet(); render(); if (g.done) toast('Goal complete. Nice work!'); },
  goalDel: d => confirmSheet('Delete this goal?', 'Its history is removed too.', () => { state.goals = state.goals.filter(x => x.id !== d.id); saveState(); render(); }, 'Delete goal'),
  unitSet: d => { state.settings.unit = d.v; saveState(); render(); settingsSheet(); },
  resetAll: () => confirmSheet('Delete all your data?', 'This removes every workout, weigh-in, goal and program from this app. It cannot be undone.', () => { const old = logs.slice(); state = blankState(); logs = []; saveState(true); old.forEach(l => deleteLog(l.id)); render(); toast('All data deleted'); }, 'Delete everything'),
  delLog: d => confirmSheet('Delete this workout?', 'It is removed from your history, progress charts and program tracking.', () => { logs = logs.filter(l => l.id !== d.id); deleteLog(d.id); render(); }, 'Delete workout'),
  repeatLog: d => { const l = logs.find(x => x.id === d.id); state.draft = { name: l.name, programId: null, dayIndex: null, items: l.items.filter(i => EX[i.exId]).map(i => ({ exId: i.exId, sets: i.sets.length, reps: i.target || String(i.sets[0]?.r || 10), link: !!i.link })) }; if (state.draft.items.length) state.draft.items[state.draft.items.length - 1].link = false; saveState(); go('workout'); },
  backup: () => {
    const blob = new Blob([JSON.stringify({ app: 'duolifto', version: 1, exported: new Date().toISOString(), state, logs })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `duolifto-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
  },
  confirmYes: () => { const f = pendingConfirm; pendingConfirm = null; closeSheet(); f && f(); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'scrim') ev.preventDefault();
  fn(el.dataset, el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.input; if (!k) return;
  if (k === 'q') { ui.q = el.value; renderExList(); }
  else if (k === 'draftName') { state.draft.name = el.value; saveState(); }
  else if (k === 'itSets') { state.draft.items[+el.dataset.i].sets = el.value; saveState(); }
  else if (k === 'itReps') { state.draft.items[+el.dataset.i].reps = el.value; saveState(); }
  else if (k === 'coachText') ui.coachText = el.value;
  else if (k === 'coachPick') state.coach.items[+el.dataset.i].pick = el.checked;
  else if (k === 'setW') { state.active.items[+el.dataset.k].sets[+el.dataset.n].w = el.value; saveState(); }
  else if (k === 'setR') { state.active.items[+el.dataset.k].sets[+el.dataset.n].r = el.value; saveState(); }
  else if (k === 'progressEx') { ui.progressEx = el.value; render(); }
  else if (k === 'gType') goalTypeChanged();
  else if (k === 'pickQ') renderPick(el.value);
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.input === 'gType') goalTypeChanged();
  if (ev.target.id === 'restoreFile' && ev.target.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.state || !Array.isArray(d.logs)) throw 0; confirmSheet('Restore this backup?', `It has ${d.logs.length} workouts from ${String(d.exported || '').slice(0, 10) || 'an earlier date'}. It replaces everything currently in the app.`, () => { state = normalize(d.state); logs = d.logs; sortLogs(); lsSet(); render(); toast('Backup restored'); }, 'Restore'); } catch { toast('That file is not a Duolifto backup'); } };
    r.readAsText(ev.target.files[0]);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'coachText' && !ev.shiftKey) { ev.preventDefault(); runCoach(0); } if (ev.key === 'Escape') closeSheet(); });
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.dataset.form === 'bw') {
    const kg = parseFloat($('#bwKg').value), date = $('#bwDate').value || today(); if (!(kg > 0)) return;
    state.bodyweight = state.bodyweight.filter(b => b.date !== date).concat({ date, kg }).sort((a, b) => a.date < b.date ? -1 : 1);
    saveState(); closeSheet(); render(); toast(`Logged ${kg} ${unit()}`);
  } else if (f.dataset.form === 'goal') {
    const type = $('#gType').value, target = parseFloat($('#gTarget').value); if (isNaN(target)) return;
    const g = { id: uid(), type, target, created: today(), deadline: $('#gDeadline').value || null, history: [], done: false };
    if (type === 'bodyweight') { const b = latestBW(); g.start = b ? b.kg : target; g.title = `Reach ${target} ${unit()} body weight`; if (!b) setTimeout(() => toast('Log your body weight to track this goal'), 2500); }
    else if (type === 'lift') { g.exId = $('#gEx').value; g.start = bestTop(g.exId) || 0; g.title = `${EX[g.exId].name}: ${target} ${unit()}`; }
    else if (type === 'attendance') { g.start = 0; g.title = `Train ${target} days a week`; }
    else { g.start = parseFloat($('#gStart').value) || 0; g.unit = $('#gUnit').value.trim(); g.title = $('#gTitle').value.trim() || `Reach ${target}${g.unit ? ' ' + g.unit : ''}`; }
    g.history.push({ d: today(), v: g.start, note: 'Goal set' });
    state.goals.push(g); saveState(); closeSheet(); render(); toast('Goal added');
  } else if (f.dataset.form === 'goalUpd') {
    const g = state.goals.find(x => x.id === f.dataset.id); const v = $('#guVal') ? $('#guVal').value : ''; const note = $('#guNote').value.trim(); const nt = parseFloat($('#guTarget').value);
    if (!isNaN(nt) && nt !== +g.target) { g.history.push({ d: today(), v: '', note: `Target changed from ${g.target} to ${nt}` }); g.target = nt; }
    if (v !== '' || note) g.history.push({ d: today(), v: v === '' ? (g.type === 'custom' ? '' : goalProgress(g).current) : +v, note });
    const p = goalProgress(g); saveState(); closeSheet(); render(); toast(p.pct >= 100 ? 'Target reached! Mark it complete when you are ready.' : 'Goal updated');
  }
});

// ---------- boot ----------
const h0 = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h0)) ui.tab = h0;
initStore();
