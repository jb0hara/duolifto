steps":["Pull your shoulders down and slightly back to start.","Raise your legs, keeping them as straight as you can, toward the bar.","Touch your toes to the bar or get as close as you can.","Lower your legs under control; do not drop."],"cues":["Pull the bar down toward your thighs","Control the swing on the way down","Build up with knee raises first"],"mistakes":["Dropping the legs and swinging wildly","Attempting it without enough grip strength"],"breathing":"Breathe out as you raise your legs, in as you lower.","diagram":"leg_raise"},"captains-chair-leg-raise":{"setup":"Stand on the captain's chair, forearms on the pads, back against the pad, and legs hanging.","steps":["Press your back into the pad and grip the handles.","Raise your legs, knees bent or straight, up toward hip height or higher.","Curl your pelvis slightly at the top.","Lower slowly without swinging."],"cues":["Back stays on the pad","Lift with your abs, not momentum","Slow and smooth"],"mistakes":["Swinging the legs up and down fast","Letting your lower back arch"],"breathing":"Breathe out as you raise your legs, in as you lower.","diagram":"leg_raise"},"lying-leg-raise":{"setup":"Lie flat on your back with legs straight and hands under your hips or by your sides.","steps":["Press your lower back into the floor and brace your abs.","Raise your straight legs until they point at the ceiling.","Lower them slowly, stopping before your back arches.","Repeat without letting your feet rest on the floor."],"cues":["Lower back stays pressed down","Bend knees slightly if needed","Slow lowering"],"mistakes":["Letting the lower back arch off the floor","Dropping the legs quickly"],"breathing":"Breathe out as you raise your legs, in as you lower.","diagram":"leg_raise"},"reverse-crunch":{"setup":"Lie on your back with hips and knees bent to 90 degrees and arms flat by your sides.","steps":["Brace your abs and curl your hips off the floor, knees toward your chest.","Lift only a few centimetres, using your abs.","Pause at the top.","Lower your hips slowly back to the floor."],"cues":["Roll the pelvis up, don't swing","Keep the movement small and slow","Press your hands lightly into the floor"],"mistakes":["Swinging the legs to throw hips up","Using arm push instead of abs"],"breathing":"Breathe out as you curl up, in as you lower.","diagram":"leg_raise"},"ab-wheel-rollout":{"setup":"Kneel on a mat holding an ab wheel under your shoulders, with your back slightly rounded and abs braced.","steps":["Tuck your pelvis and brace your abs hard.","Roll the wheel forward slowly, keeping your hips and shoulders in line.","Go as far as you can without your lower back sagging.","Pull the wheel back by squeezing your abs."],"cues":["Keep your hips tucked under","Only go as far as you can control","Slow roll out, slow roll in"],"mistakes":["Letting the lower back sag and arch","Rolling out too far too soon"],"breathing":"Breathe in as you roll out, out as you pull back.","diagram":"plank"},"dead-bug":{"setup":"Lie on your back with arms straight up and hips and knees bent to 90 degrees.","steps":["Press your lower back into the floor and brace your abs.","Lower your right arm overhead and left leg toward the floor together.","Stop before your lower back arches.","Return and repeat with the opposite arm and leg."],"cues":["Lower back stays glued to the floor","Move slowly and smoothly","Exhale to keep the ribs down"],"mistakes":["Letting the lower back arch away from the floor","Moving too fast"],"breathing":"Breathe out as you extend, in as you return.","diagram":"plank"},"hollow-body-hold":{"setup":"Lie on your back with arms extended overhead and legs straight together.","steps":["Press your lower back firmly into the floor.","Lift your shoulders and straight legs a few centimetres off the floor.","Hold a shallow banana shape with abs tight.","Lower with control when done."],"cues":["Lower back stays pressed down","Raise legs higher to make it easier","Chin tucked slightly"],"mistakes":["Letting the lower back arch up","Lifting the legs too low to hold form"],"breathing":"Breathe in short, steady breaths; do not hold your breath.","diagram":"plank"},"v-up":{"setup":"Lie flat on your back with legs straight and arms extended overhead.","steps":["Brace your abs and lift your legs and torso at the same time.","Reach your hands toward your toes, forming a V.","Pause briefly at the top.","Lower with control and repeat."],"cues":["Reach hands toward toes","Keep legs fairly straight","Control the descent"],"mistakes":["Using momentum to swing up","Rounding the neck and dropping down fast"],"breathing":"Breathe out as you rise, in as you lower.","diagram":"crunch"},"bicycle-crunch":{"setup":"Lie on your back with hands lightly behind your head and legs lifted with knees bent.","steps":["Lift your shoulders off the floor and bring your knees in.","Twist to bring your right elbow toward your left knee while extending the right leg.","Switch sides in a smooth pedalling motion.","Keep going without letting your shoulders rest."],"cues":["Rotate your ribs, not just the elbows","Slow, controlled pedalling","Lower back stays down"],"mistakes":["Pulling on the neck with the hands","Going so fast the rotation is lost"],"breathing":"Breathe steadily; breathe out on each twist.","diagram":"crunch"},"russian-twist":{"setup":"Sit on the floor, lean back about 45 degrees with knees bent and a weight or hands held at your chest.","steps":["Lean back with a long spine and feet down or lifted.","Rotate your torso to one side, moving the weight with you.","Rotate to the other side under control.","Continue alternating sides."],"cues":["Turn from the ribs, not just the arms","Keep your chest tall","Feet down for an easier version"],"mistakes":["Rounding the back and slumping","Swinging the arms instead of turning the torso"],"breathing":"Breathe out on each twist; keep breathing steadily.","diagram":"rotation"},"pallof-press":{"setup":"Set a cable at chest height and stand side-on to it, holding the handle at your chest with feet shoulder-width apart.","steps":["Hold the handle with both hands at the centre of your chest.","Press it straight out in front, resisting the cable's pull to rotate.","Hold for a second with arms fully extended.","Bring it back to your chest slowly."],"cues":["Don't let the cable twist you","Hips and shoulders stay square","Brace your core before pressing"],"mistakes":["Letting the torso rotate toward the cable","Standing too close with no tension"],"breathing":"Breathe out as you press, in as you return.","diagram":"rotation"},"cable-woodchop":{"setup":"Set a cable pulley high or low and stand side-on to it, holding the handle with both hands.","steps":["Grip the handle and set your feet wider than your hips.","Pull the cable diagonally across your body, turning your torso.","Pivot your back foot and keep your arms mostly straight.","Return slowly under control."],"cues":["Rotate from your trunk and hips","Arms are just the handles","Keep a tall, strong posture"],"mistakes":["Using just the arms to yank the cable","Twisting the lower back instead of pivoting"],"breathing":"Breathe out as you chop, in as you return.","diagram":"rotation"},"landmine-rotation":{"setup":"Place a barbell in a landmine holder, stand holding the free end with both hands at chest height, feet shoulder-width.","steps":["Hold the end of the bar in front of your chest with straight arms.","Swing the bar in an arc to one side by rotating your torso.","Pivot your feet and keep your arms extended.","Swing back through the middle to the other side."],"cues":["Turn through hips and torso together","Arms stay straight and long","Smooth arc, controlled speed"],"mistakes":["Using the arms to push the bar around","Locking the knees and twisting the lower back"],"breathing":"Breathe out as you rotate, in as you pass the middle.","diagram":"rotation"},"suitcase-carry":{"setup":"Stand with a heavy dumbbell in one hand at your side, feet hip-width apart.","steps":["Pick up the dumbbell and stand tall with shoulders level.","Brace your core and keep your torso upright.","Walk in a straight line with steady steps.","Set the weight down, then repeat on the other side."],"cues":["Don't lean toward or away from the weight","Shoulders level, ribs down","Short steady steps"],"mistakes":["Leaning sideways to compensate","Letting the shoulder shrug up"],"breathing":"Breathe steadily; do not hold your breath.","diagram":"carry"},"farmers-carry":{"setup":"Stand between two heavy dumbbells, feet hip-width apart, and pick them up with a neutral spine.","steps":["Hinge down, grip the handles, and stand up tall.","Pull your shoulders back and down, and brace your abs.","Walk with short, quick steps for the set distance.","Lower the weights under control."],"cues":["Stand tall, chest proud","Squeeze the handles hard","Steady steps, no swaying"],"mistakes":["Letting shoulders round forward","Rounding the back when picking up or lowering"],"breathing":"Breathe steadily; do not hold your breath.","diagram":"carry"},"mountain-climber":{"setup":"Start in a high plank with hands under shoulders and body in a straight line.","steps":["Brace your core and keep your hips level.","Drive one knee toward your chest.","Switch legs quickly in a running motion.","Keep your hands planted and shoulders over your wrists."],"cues":["Hips low and level","Shoulders over wrists","Keep a steady rhythm"],"mistakes":["Letting the hips bounce up high","Dropping the hips and arching the back"],"breathing":"Breathe in a steady rhythm; do not hold your breath.","diagram":"cardio"},"stir-the-pot":{"setup":"Place a stability ball on the floor and set yourself in a forearm plank with elbows on the ball.","steps":["Get into a plank with forearms on the ball, body straight.","Brace your abs and glutes tightly.","Move the ball in a small circle with your forearms.","Reverse the direction after a few reps."],"cues":["Keep hips and torso still","Small, slow circles","Squeeze glutes to protect your back"],"mistakes":["Letting the hips sag as the ball moves","Making circles too big to control"],"breathing":"Breathe slowly and steadily; do not hold your breath.","diagram":"plank"},"dragon-flag":{"setup":"Lie on a bench and grip behind your head, with your shoulders on the bench and legs straight up.","steps":["Grip the bench behind your head and lift your hips so you are on your upper back.","Keep your body straight like a plank.","Lower your body slowly, keeping it stiff.","Lift back up using your abs; use bent knees to make it easier."],"cues":["Body stays rigid like a board","Only lower as far as you can control","Learn with bent knees first"],"mistakes":["Folding at the hips instead of staying straight","Going too advanced and straining the lower back"],"breathing":"Breathe out as you lift, in as you lower.","diagram":"leg_raise"},"l-sit":{"setup":"Sit between parallel bars or on the floor with hands beside your hips, palms down and arms straight.","steps":["Press your hands down and lock your arms.","Lift your hips and legs off the surface.","Keep your legs straight and parallel to the floor.","Hold, then lower with control."],"cues":["Push down and shrug shoulders away","Legs straight and toes pointed","Tuck knees to make it easier"],"mistakes":["Letting shoulders hunch up to the ears","Bending the arms and sagging"],"breathing":"Breathe in short, steady breaths; do not hold your breath.","diagram":"plank"},"side-bend-dumbbell":{"setup":"Stand tall with a dumbbell in one hand at your side and your other hand on your hip or behind your head.","steps":["Stand with feet hip-width apart and the weight at your side.","Bend sideways, sliding the dumbbell down your leg.","Stop when you feel a stretch in your side.","Squeeze your obliques to return to upright."],"cues":["Bend straight sideways","Keep hips and chest facing front","Controlled, steady tempo"],"mistakes":["Leaning forward or backward as you bend","Using too heavy a weight"],"breathing":"Breathe in as you bend, out as you return.","diagram":"rotation"},"back-squat":{"setup":"Set a barbell on a rack at upper chest height, step under it, and rest it across your upper back with feet shoulder-width apart.","steps":["Grip the bar, brace your core, and unrack it with a step back.","Push your hips back and bend your knees to lower.","Lower until your thighs are at least parallel to the floor.","Drive through your whole foot to stand."],"cues":["Knees track over toes","Chest up, back flat","Push the floor away"],"mistakes":["Letting knees cave inward","Rounding the lower back at the bottom"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"low-bar-back-squat":{"setup":"Set a barbell at upper chest height and rest it low across your rear shoulders, with feet shoulder-width and toes slightly out.","steps":["Grip the bar tightly, pull it into your back, and brace.","Push your hips back first and lean forward from the hips.","Lower until your thighs are at least parallel.","Drive up, keeping the bar over mid-foot."],"cues":["Tight upper back shelf","Hips back, then knees","Bar stays over mid-foot"],"mistakes":["Letting the chest collapse forward","Letting knees cave in as you stand"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"front-squat":{"setup":"Set the bar on your front shoulders, elbows high, with a clean grip or crossed arms, feet shoulder-width.","steps":["Rest the bar on your shoulders and lift your elbows high.","Brace and lower straight down, knees tracking over toes.","Lower to parallel or deeper while keeping your chest tall.","Drive up while keeping elbows high."],"cues":["Elbows high throughout","Torso stays upright","Knees out over toes"],"mistakes":["Letting elbows drop and the bar roll forward","Rounding the upper back"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"paused-squat":{"setup":"Set up as for a normal barbell back squat, bar across your upper back, feet shoulder-width.","steps":["Unrack, brace, and squat down under control.","Reach the bottom, with thighs at or below parallel.","Hold the bottom position for 2 to 3 seconds, staying tight.","Drive up out of the hole."],"cues":["Stay tight at the bottom","Don't relax in the pause","Drive up with a strong chest"],"mistakes":["Relaxing and losing tension in the pause","Bouncing out of the hole"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"box-squat":{"setup":"Place a box or bench behind you at about knee height, set the bar on your back, and stand with feet slightly wider than shoulders.","steps":["Brace and sit your hips back to the box.","Lower under control and touch down lightly without dropping.","Stay tight; do not relax on the box.","Drive through your feet to stand."],"cues":["Sit back, shins stay near vertical","Stay tight on the box","Push the knees out"],"mistakes":["Dropping and relaxing on the box","Rocking back to stand instead of driving up"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"safety-bar-squat":{"setup":"Set a safety squat bar in a rack, step under it so the pads rest on your shoulders, and grip the handles.","steps":["Unrack the bar and step back with feet shoulder-width apart.","Brace and sit down and back between your hips.","Lower to at least parallel while keeping your chest tall.","Drive up through your feet."],"cues":["Stay upright, chest tall","Knees out over toes","Grip the handles lightly"],"mistakes":["Letting knees cave inward","Losing posture and rounding the upper back"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"zercher-squat":{"setup":"Set the bar in the rack at elbow height and hold it in the crooks of your elbows with arms tight to your torso.","steps":["Lift the bar from the rack with elbows bent, hands clasped.","Step back, brace, and squat down between your knees.","Lower to at least parallel while keeping your torso upright.","Drive up through your feet."],"cues":["Elbows tight to the ribs","Chest up, stay tall","Pad the bar for comfort"],"mistakes":["Rounding the back as the bar pulls forward","Letting elbows flare away from the body"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"goblet-squat":{"setup":"Hold a dumbbell vertically against your chest with both hands, elbows pointing down, feet shoulder-width apart.","steps":["Hold the dumbbell at your chest and brace your core.","Sit down between your legs, pushing knees out.","Lower until your thighs are parallel or deeper, with chest tall.","Push through your feet to stand."],"cues":["Elbows between your knees","Chest tall, heels down","Knees push out"],"mistakes":["Letting heels lift off the floor","Rounding forward at the bottom"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"hack-squat":{"setup":"Step into the hack squat machine with your back against the pad, feet shoulder-width on the platform, and shoulders under the pads.","steps":["Release the safety handles and straighten your legs.","Bend your knees and lower under control.","Lower until your thighs are parallel or deeper, if comfortable.","Press through your whole foot to stand without locking the knees."],"cues":["Back flat on the pad","Knees track over toes","Don't lock out hard at the top"],"mistakes":["Letting your hips lift off the pad at the bottom","Locking the knees violently at the top"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"pendulum-squat":{"setup":"Step onto the pendulum squat machine, set your shoulders under the pads, and stand with feet on the platform.","steps":["Release the safety and stand tall with a braced core.","Bend your knees and sink into a deep squat as the arm swings.","Lower to a depth that keeps your lower back flat.","Drive through your feet to stand."],"cues":["Stay braced against the pad","Knees travel forward over toes","Smooth, deep control"],"mistakes":["Letting your lower back round at the bottom","Bouncing out of the bottom"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"smith-machine-squat":{"setup":"Set the Smith bar at upper chest height, step under it, and place feet slightly in front of the bar at shoulder-width.","steps":["Rest the bar on your upper back and twist to unlock it.","Brace and bend your knees to lower straight down.","Lower until your thighs are at least parallel.","Push through your feet to stand, then rack the bar."],"cues":["Feet slightly forward of the bar","Stay braced, chest up","Know where the safety hooks are"],"mistakes":["Placing feet too far back and straining the knees","Rounding the back at the bottom"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"leg-press":{"setup":"Sit in the leg press with your back and hips flat on the pad, feet shoulder-width on the platform.","steps":["Release the safety handles with your feet shoulder-width apart.","Lower the platform by bending your knees toward your chest.","Stop when your knees are at about 90 degrees and your hips stay on the seat.","Press through your whole foot until your legs are almost straight."],"cues":["Hips and lower back stay on the pad","Knees track over toes","Do not lock your knees hard"],"mistakes":["Letting hips curl up off the seat at the bottom","Locking the knees at the top under load"],"breathing":"Breathe in as you lower, out as you press.","diagram":"squat"},"single-leg-leg-press":{"setup":"Sit in the leg press with your back and hips flat, one foot in the middle of the platform and the other leg relaxed.","steps":["Release the safety handles with one foot planted.","Lower the platform under control until your knee is at about 90 degrees.","Keep the knee tracking over your toes.","Press through your foot to near-straight, without locking out."],"cues":["Keep hips level and flat","Use less weight than two-legged","Knee follows the toes"],"mistakes":["Letting the hips twist or lift off the seat","Letting the knee cave inward"],"breathing":"Breathe in as you lower, out as you press.","diagram":"squat"},"belt-squat":{"setup":"Fasten the belt around your hips, attach it to the machine or weight, and stand on the platforms with your feet shoulder-width apart.","steps":["Stand tall to take the weight on the belt.","Bend your knees and sit down between your feet.","Lower until your thighs are at or below parallel.","Drive through your feet to stand."],"cues":["Stay tall; the load pulls straight down","Knees track over toes","Brace your core"],"mistakes":["Leaning forward and rounding the back","Letting the knees cave in"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"bodyweight-squat":{"setup":"Stand with feet shoulder-width apart, toes slightly out, arms in front or crossed on your chest.","steps":["Brace your core and look forward.","Push your hips back and bend your knees to lower.","Lower until your thighs are about parallel to the floor.","Push through your whole foot to stand tall."],"cues":["Knees track over toes","Chest up, heels flat","Sit down between your hips"],"mistakes":["Letting heels lift off the floor","Letting knees collapse inward"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"pistol-squat":{"setup":"Stand on one leg, with the other leg extended in front and arms stretched forward for balance. Hold a support if you need it.","steps":["Brace your core and reach your arms forward.","Sit back and lower on your standing leg, free leg held straight out.","Lower as deep as you can while keeping your heel flat.","Drive through your whole foot to stand."],"cues":["Heel stays flat","Knee tracks over your toes","Use a box or TRX for help"],"mistakes":["Letting the knee cave inward","Dropping fast and losing control at the bottom"],"breathing":"Breathe in at the top, brace, and breathe out as you stand up.","diagram":"squat"},"sissy-squat":{"setup":"Stand with feet hip-width apart, holding a support with one hand, and rise slightly onto your toes.","steps":["Hold a support and lift your heels off the floor.","Lean back and let your knees travel forward as you lower.","Lower only as deep as your knees comfortably allow.","Push up by straightening your knees and squeezing your thighs."],"cues":["Keep body in a straight line","Control the lowering","Start with a small range"],"mistakes":["Going deeper than your knees can handle","Bending at the hips instead of leaning back"],"breathing":"Breathe in as you lower, out as you rise.","diagram":"squat"},"jump-squat":{"setup":"Stand with feet shoulder-width apart, toes slightly out, arms ready in front of your chest.","steps":["Squat down to a quarter or half-squat depth.","Explode upward, jumping as high as you can.","Land softly on the balls of your feet and bend your knees.","Go straight into the next rep or reset."],"cues":["Land soft and quiet","Knees stay over toes","Swing arms for extra height"],"mistakes":["Landing with stiff, locked knees","Letting knees cave in on landing"],"breathing":"Breathe out as you jump, in as you land.","diagram":"jump"},"box-jump":{"setup":"Stand facing a sturdy box about an arm's length away, feet hip-width apart.","steps":["Swing your arms back and bend your hips and knees into a quarter squat.","Swing your arms forward and jump up explosively onto the box.","Land softly with both feet flat, knees bent, near the box centre.","Stand tall, then step down one foot at a time."],"cues":["Land quietly like a cat","Drive through the whole foot","Stand fully before stepping down"],"mistakes":["Jumping down off the box, which stresses the Achilles","Choosing a box too high to land safely"],"breathing":"Breathe in as you load the jump and out as you take off.","diagram":"jump"},"bulgarian-split-squat":{"setup":"Stand facing away from a bench, rear foot resting on it, a dumbbell in each hand.","steps":["Step your front foot forward so your hips stay square and balanced.","Lower straight down until your front thigh is about parallel to the floor.","Keep your torso tall and your front knee tracking over your toes.","Press through the front heel to stand back up."],"cues":["Drop straight down, not forward","Weight on the front heel","Chest tall, core braced"],"mistakes":["Standing too close to the bench, which pinches the front knee","Pushing off the back foot instead of the front leg"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"lunge"},"walking-lunge":{"setup":"Stand tall holding a dumbbell in each hand at your sides, with space to walk forward.","steps":["Step forward with one leg in a long stride.","Lower until both knees are bent to about 90 degrees.","Push through the front foot and bring your back leg forward.","Step straight into the next lunge with the other leg."],"cues":["Long stride, upright torso","Front knee over mid-foot","Control each step down"],"mistakes":["Taking steps too short, which overloads the knee","Leaning forward and letting the trunk collapse"],"breathing":"Breathe in as you lower and out as you step through.","diagram":"lunge"},"reverse-lunge":{"setup":"Stand tall holding a dumbbell in each hand at your sides, feet hip-width apart.","steps":["Step one leg straight back, landing on the ball of that foot.","Lower until both knees are bent to about 90 degrees.","Keep your front shin near vertical and your chest up.","Push through the front heel to return to standing, then switch legs."],"cues":["Front heel stays planted","Back knee hovers above the floor","Stay tall through the torso"],"mistakes":["Stepping back on a tightrope line, losing balance","Letting the front knee collapse inward"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"lunge"},"barbell-lunge":{"setup":"Rack a barbell across your upper back as for a squat, then step back with feet hip-width apart.","steps":["Brace your core and step forward into a long stride.","Lower your back knee toward the floor, front shin near vertical.","Push hard through the front foot to return to the start.","Repeat on the other leg, or finish all reps on one side first."],"cues":["Brace before every rep","Keep the bar still on your back","Drive through the front heel"],"mistakes":["Leaning forward and letting the bar roll","Using a load too heavy to control your balance"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"lunge"},"bodyweight-lunge":{"setup":"Stand tall with feet hip-width apart and your hands on your hips.","steps":["Step forward with one leg in a long stride.","Lower until both knees are bent to about 90 degrees.","Keep your torso upright and your front knee over your toes.","Push through the front foot back to the start, then switch legs."],"cues":["Tall chest, level hips","Front heel stays down","Smooth, controlled lowering"],"mistakes":["Short steps that load the front knee too much","Letting the front knee cave inward"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"lunge"},"step-up":{"setup":"Stand facing a sturdy bench or box with a dumbbell in each hand at your sides.","steps":["Place one whole foot firmly on the box.","Press through that heel to stand up fully on the box.","Lower slowly back down with control, trailing foot first.","Finish all reps on one leg, then switch."],"cues":["Work with the top leg","Stand tall at the top","Lower under control"],"mistakes":["Pushing off the back foot to cheat the rep","Using a box so high your hips rise above the knee"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"step_up"},"lateral-lunge":{"setup":"Stand tall with feet together, holding one dumbbell at your chest with both hands.","steps":["Take a big step out to the side with one foot, toes forward.","Sit your hips back and bend that knee, keeping the other leg straight.","Keep your chest up and your bent-knee heel flat.","Push off the bent leg to return to the middle, then switch sides."],"cues":["Sit back into the hip","Toes point forward","Chest tall, heel down"],"mistakes":["Rounding the back as you lower","Letting the working heel lift off the floor"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"lunge"},"curtsy-lunge":{"setup":"Stand tall with feet hip-width apart, holding a dumbbell at your chest.","steps":["Step one leg back and across behind the other, like a curtsy.","Lower until your front thigh is near parallel to the floor.","Keep your hips and chest facing forward.","Push through the front heel to return, then repeat or switch."],"cues":["Hips and chest face forward","Front knee tracks over toes","Control the lowering"],"mistakes":["Twisting the torso instead of stepping across","Stepping so far across that you lose balance"],"breathing":"Breathe in on the way down and out as you drive up.","diagram":"lunge"},"leg-extension":{"setup":"Sit on the machine with your back against the pad and the roller resting on your lower shins.","steps":["Adjust the seat so your knees line up with the machine's pivot.","Grip the handles and extend your knees until legs are almost straight.","Squeeze your thighs for a second at the top.","Lower slowly until your knees are bent about 90 degrees."],"cues":["Squeeze at the top","Lower for about three seconds","Keep hips pressed into the seat"],"mistakes":["Swinging the weight up with momentum","Locking the knees hard at the top"],"breathing":"Breathe out as you lift and in as you lower.","diagram":"leg_extension"},"single-leg-leg-extension":{"setup":"Sit on the machine with your back against the pad and one shin under the roller.","steps":["Adjust the seat so your knee lines up with the machine's pivot.","Extend one knee until the leg is almost straight.","Pause and squeeze your thigh for a second.","Lower slowly, finish your reps, then switch legs."],"cues":["One leg at a time, no twisting","Squeeze at the top","Slow lowering"],"mistakes":["Leaning back or lifting the hips to help","Using a weight that makes the rep jerky"],"breathing":"Breathe out as you lift and in as you lower.","diagram":"leg_extension"},"romanian-deadlift":{"setup":"Stand holding a barbell at hip height with an overhand grip, feet hip-width apart.","steps":["Soften your knees, brace your core and pull your shoulders back.","Push your hips back, sliding the bar down your thighs.","Lower until you feel a strong hamstring stretch, back flat.","Drive your hips forward to stand tall, squeezing your glutes."],"cues":["Hips back, not down","Keep the bar close to your legs","Flat back the whole way"],"mistakes":["Rounding the lower back at the bottom","Bending the knees too much so it becomes a squat"],"breathing":"Breathe in as you lower and out as you stand.","diagram":"hinge"},"dumbbell-romanian-deadlift":{"setup":"Stand holding a dumbbell in each hand in front of your thighs, feet hip-width apart.","steps":["Soften your knees, brace your core and pull your shoulders back.","Push your hips back, sliding the dumbbells down your legs.","Lower until you feel a strong hamstring stretch, back flat.","Drive your hips forward to stand tall, squeezing your glutes."],"cues":["Hips back, not down","Dumbbells stay close to the legs","Flat back the whole way"],"mistakes":["Rounding the back to reach lower","Letting the dumbbells drift away from your legs"],"breathing":"Breathe in as you lower and out as you stand.","diagram":"hinge"},"single-leg-romanian-deadlift":{"setup":"Stand on one foot holding a dumbbell in the opposite hand, standing knee slightly bent.","steps":["Brace your core and hinge forward at the hip.","Extend your free leg straight behind you as the dumbbell lowers.","Keep your hips level and back flat until you feel a hamstring stretch.","Squeeze your glute to return to standing, then switch legs."],"cues":["Hips stay square to the floor","Reach long through the back heel","Eyes on a spot ahead"],"mistakes":["Opening the hips and twisting the torso","Rounding the back to reach the floor"],"breathing":"Breathe in as you lower and out as you stand.","diagram":"hinge"},"stiff-leg-deadlift":{"setup":"Stand holding a barbell at hip height with an overhand grip, feet hip-width apart, knees nearly straight.","steps":["Brace your core and keep your knees only slightly bent.","Hinge forward at the hips, sliding the bar down your legs.","Lower to about mid-shin or until your hamstrings are tight.","Drive your hips forward to stand tall."],"cues":["Knees stay almost straight","Bar glides along your legs","Back stays flat"],"mistakes":["Rounding the back, which loads the spine","Going lower than your flexibility allows"],"breathing":"Breathe in as you lower and out as you stand.","diagram":"hinge"},"kettlebell-swing":{"setup":"Stand with feet slightly wider than shoulders, a kettlebell on the floor a step in front of you.","steps":["Hinge at the hips and grip the bell with both hands, back flat.","Hike the bell back between your legs, forearms near your thighs.","Snap your hips forward to swing the bell up to chest height.","Let it fall back and hinge again, keeping the rhythm smooth."],"cues":["Power comes from the hips","Arms are just ropes","Stand tall and squeeze glutes at top"],"mistakes":["Squatting the swing instead of hinging","Lifting the bell with your arms or leaning back"],"breathing":"Breathe out sharply on the hip snap and in as the bell drops.","diagram":"swing"},"lying-leg-curl":{"setup":"Lie face down on the machine with the pad resting just above your heels and hips flat.","steps":["Grip the handles and keep your hips pressed into the bench.","Curl your heels toward your glutes as far as comfortable.","Squeeze your hamstrings for a second at the top.","Lower slowly until your legs are almost straight."],"cues":["Hips stay glued to the bench","Squeeze at the top","Lower for about three seconds"],"mistakes":["Lifting the hips off the pad to swing the weight","Dropping the weight quickly on the way down"],"breathing":"Breathe out as you curl and in as you lower.","diagram":"leg_curl"},"seated-leg-curl":{"setup":"Sit on the machine with your back against the pad and the roller just above your heels.","steps":["Set the thigh pad snug so your legs cannot lift.","Curl your heels down and back as far as comfortable.","Squeeze your hamstrings for a second at the bottom.","Let the legs rise back slowly until nearly straight."],"cues":["Thigh pad locked in firmly","Pull heels under the seat","Slow return"],"mistakes":["Leaning forward to cheat the curl","Letting the weight stack slam back up"],"breathing":"Breathe out as you curl and in as you return.","diagram":"leg_curl"},"nordic-hamstring-curl":{"setup":"Kneel on a pad with your ankles anchored under a bar or held by a partner, body straight from knees to head.","steps":["Cross your arms or hold them ready to catch yourself.","Keep your hips extended and lean forward as slowly as you can.","Lower until you can no longer hold, then catch yourself with your hands.","Push off the floor lightly and pull back up with your hamstrings."],"cues":["Straight line from knee to head","Lower as slowly as possible","Squeeze glutes to stay long"],"mistakes":["Bending at the hips as you fall forward","Dropping fast with no control at all"],"breathing":"Breathe in as you lean forward and out as you recover.","diagram":"leg_curl"},"glute-ham-raise":{"setup":"Set up on the GHR machine with feet braced on the plate and thighs on the pad, hips just past the edge.","steps":["Cross your arms and start with your body in a straight line.","Lower your torso toward the floor by hinging at the hips.","Squeeze your hamstrings and glutes to pull yourself back up.","Finish tall without leaning back past a straight line."],"cues":["Body stays long and straight","Pull with the hamstrings","Control the lowering"],"mistakes":["Arching the lower back at the top","Using momentum to bounce out of the bottom"],"breathing":"Breathe in as you lower and out as you rise.","diagram":"leg_curl"},"stability-ball-leg-curl":{"setup":"Lie on your back with your heels on a stability ball and arms flat by your sides.","steps":["Press your hips up so your body forms a straight line.","Pull your heels toward your glutes, rolling the ball in.","Hold the hips high and squeeze your hamstrings.","Roll the ball slowly back out without dropping your hips."],"cues":["Keep hips high all the time","Squeeze glutes and hamstrings","Move slowly and steadily"],"mistakes":["Letting the hips sag as the ball moves","Rolling the ball too fast to control it"],"breathing":"Breathe out as you curl in and in as you extend.","diagram":"leg_curl"},"barbell-hip-thrust":{"setup":"Sit on the floor with your upper back against a bench and a padded barbell across your hips.","steps":["Plant your feet hip-width apart with your knees bent.","Brace your core and drive through your heels to lift your hips.","Stop when your torso is level, shins vertical, and squeeze glutes.","Lower under control until your glutes are just above the floor."],"cues":["Chin tucked, ribs down","Squeeze glutes at the top","Shins vertical at the top"],"mistakes":["Arching the lower back at the top","Pushing through the toes with feet too close"],"breathing":"Breathe out as you lift and in as you lower.","diagram":"hip_thrust"},"machine-hip-thrust":{"setup":"Sit in the machine with your upper back on the pad and the belt or pad across your hips.","steps":["Set your feet flat, hip-width apart, knees bent.","Brace your core and drive through your heels to lift your hips.","Pause at the top with your glutes squeezed hard.","Lower under control to the start."],"cues":["Drive through the heels","Ribs down, chin tucked","Squeeze glutes at the top"],"mistakes":["Overarching the lower back at the top","Dropping the weight quickly on the way down"],"breathing":"Breathe out as you lift and in as you lower.","diagram":"hip_thrust"},"single-leg-hip-thrust":{"setup":"Sit with your upper back against a bench, one foot planted and the other leg raised, knee bent.","steps":["Brace your core and press through the planted heel.","Lift your hips until your torso is level with the floor.","Keep your hips level and squeeze your glute at the top.","Lower slowly, finish your reps, then switch legs."],"cues":["Keep hips level, no twisting","Squeeze the glute at the top","Drive through the heel"],"mistakes":["Letting the hips rotate or drop to one side","Arching the lower back at the top"],"breathing":"Breathe out as you lift and in as you lower.","diagram":"hip_thrust"},"glute-bridge":{"setup":"Lie on your back with knees bent, feet flat hip-width apart, and arms by your sides.","steps":["Brace your core and press through your heels.","Lift your hips until your body forms a straight line from shoulders to knees.","Squeeze your glutes hard at the top for a second.","Lower slowly until your hips almost touch the floor."],"cues":["Push through the heels","Squeeze glutes, not your back","Ribs stay down"],"mistakes":["Overarching the lower back at the top","Pushing through the toes and straining the knees"],"breathing":"Breathe out as you lift and in as you lower.","diagram":"hip_thrust"},"cable-pull-through":{"setup":"Stand facing away from a low cable with a rope between your legs, a few steps out from the stack.","steps":["Hold the rope with both hands and walk forward until there is tension.","Hinge your hips back, letting the rope pass between your legs.","Keep your back flat and feel a stretch in your hamstrings.","Drive your hips forward and squeeze your glutes to stand tall."],"cues":["Hips go back, not down","Arms stay long like ropes","Squeeze glutes at the top"],"mistakes":["Squatting instead of hinging","Pulling with the arms or leaning back at the top"],"breathing":"Breathe in as you hinge back and out as you stand.","diagram":"hinge"},"cable-glute-kickback":{"setup":"Attach an ankle cuff to a low cable and face the machine, holding the frame for support.","steps":["Strap the cuff on one ankle and step back to create tension.","Brace your core and keep your hips square.","Kick your leg straight back, squeezing your glute at the end.","Return slowly without letting the weight stack rest, then switch."],"cues":["Squeeze the glute at the top","Hips stay square","Keep your torso steady"],"mistakes":["Arching the lower back to kick higher","Swinging the leg with momentum"],"breathing":"Breathe out as you kick back and in as you return.","diagram":"kickback"},"hip-abduction-machine":{"setup":"Sit in the machine with your back against the pad and the pads against the outside of your knees.","steps":["Adjust the pads and select a light to moderate weight.","Sit tall and brace your core.","Push your knees apart as far as you comfortably can.","Pause briefly, then bring them back together slowly."],"cues":["Press out with the outer hips","Stay tall in the seat","Slow return"],"mistakes":["Rocking the torso to push the weight","Letting the pads slam shut between reps"],"breathing":"Breathe out as you push out and in as you return.","diagram":"abduction"},"banded-lateral-walk":{"setup":"Place a resistance band just above your knees or around your ankles and stand in a quarter squat.","steps":["Keep your feet hip-width apart with tension in the band.","Step sideways with your lead foot, keeping toes forward.","Follow with the trailing foot without letting the feet touch.","Take 10 to 15 steps one way, then walk back the other way."],"cues":["Stay low in a quarter squat","Toes point straight ahead","Keep tension on the band"],"mistakes":["Letting the knees cave inward","Standing up tall and losing eet on the platform edge.","steps":["Straighten your knees and lift the weight off the stack.","Lower your heels until you feel a deep calf stretch.","Rise as high as you can onto your toes.","Pause at the top, then lower slowly."],"cues":["Full stretch at the bottom","Pause at the top","Slow, controlled lowering"],"mistakes":["Bouncing out of the bottom with momentum","Cutting the range of motion short"],"breathing":"Breathe out as you rise and in as you lower.","diagram":"calf_raise"},"seated-calf-raise":{"setup":"Sit in the machine with the pads on your lower thighs and the balls of your feet on the platform.","steps":["Release the safety and let your heels drop for a calf stretch.","Press up through the balls of your feet as high as you can.","Pause and squeeze for a second at the top.","Lower slowly back to the deep stretch."],"cues":["Deep stretch at the bottom","Pause at the top","Keep reps slow"],"mistakes":["Bouncing the weight at the bottom","Using a half range of motion"],"breathing":"Breathe out as you rise and in as you lower.","diagram":"calf_raise"},"leg-press-calf-raise":{"setup":"Sit in a leg press with the balls of your feet on the lower edge of the platform, legs almost straight.","steps":["Release the safety and keep your knees softly extended.","Let your toes pull back to feel a calf stretch.","Press through the balls of your feet to rise high.","Pause at the top, then lower slowly."],"cues":["Knees stay almost straight","Full range, stretch to squeeze","Pause at the top"],"mistakes":["Locking or bending the knees during reps","Using so much weight the range shrinks"],"breathing":"Breathe out as you press and in as you return.","diagram":"calf_raise"},"single-leg-calf-raise":{"setup":"Stand on one foot with the ball of that foot on a step edge, holding a wall or rail for balance.","steps":["Let your heel drop below the step for a calf stretch.","Rise as high as you can onto your toes.","Pause and squeeze the calf at the top.","Lower slowly, fini function pathBox(d) {
  const n = d.match(/-?\d+(\.\d+)?/g).map(Number), xs = [], ys = [];
  for (let i = 0; i + 1 < n.length; i += 2) { xs.push(n[i], 200 - n[i]); ys.push(n[i + 1]); }
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
// Shows only the views (front/back) that contain worked muscles, zoomed in on that area.
function bodyMap(primary, secondary) {
  const P = new Set(primary), S = new Set(secondary);
  const fill = id => P.has(id) ? SG[M[id].sub].color : S.has(id) ? M[id].color : null;
  const views = ['front', 'back'].map(key => {
    const hits = BODY[key].filter(([id]) => P.has(id) || S.has(id));
    const prim = BODY[key].filter(([id]) => P.has(id));
    if (!hits.length) return null;
    let [x0, y0, x1, y1] = (prim.length ? prim : hits).map(([, d]) => pathBox(d)).reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
    const padd = 22; x0 -= padd; y0 -= padd; x1 += padd; y1 += padd;
    let w = x1 - x0, h = y1 - y0;
    const minW = 120, minH = 110;
    if (w < minW) { x0 -= (minW - w) / 2; w = minW; }
    if (h < minH) { y0 -= (minH - h) / 2; h = minH; }
    if (h > w * 1.6) { const nw = h / 1.6; x0 -= (nw - w) / 2; w = nw; }
    if (w > h * 1.4) { const nh = w / 1.4; y0 -= (nh - h) / 2; h = nh; }
    const parts = BODY[key].map(([id, d]) => { const f = fill(id); return `<path d="${d}" class="${f ? 'hl' : 'mu'}" ${f ? `style="fill:${f}"` : ''}><title>${esc(M[id].name)}</title></path>`; }).join('');
    const half = `<path d="${BODY_OUTLINE}" class="sil"/>${parts}`;
    return { key, prim: prim.length, svg: `<figure class="bmv"><svg class="bodymap" viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${key} view"><ellipse cx="100" cy="30" rx="16" ry="20" class="sil"/>${half}<g transform="translate(200 0) scale(-1 1)">${half}</g></svg><figcaption>${key === 'front' ? 'Front' : 'Back'}</figcaption></figure>` };
  }).filter(Boolean).sort((a, b) => b.prim - a.prim).filter((v, i, all) => v.prim || !all[0].prim);
  return `<div class="bmrow" role="img" aria-label="Muscles worked: ${esc(primary.concat(secondary).map(m => M[m].name).join(', '))}">${views.map(v => v.svg).join('')}</div>`;
}

  s += `<text x="${L}" y="${H - 6}">${fmtD(pts[0].x)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtD(pts[pts.length - 1].x)}</text></svg>`;

  if (sampleFn && !seed) { try { res = await claudeRecommend(text); } catch (err) { console.warn('coach fallback', err); if (err?.code === 'not_granted') sampleFn = null; } }

}

// Active session

  state.active = { id: uid(), name: d.name || defaultName(d.items), started: Date.now(), date: today(), programId: d.programId, dayIndex: d.dayIndex, runId: d.programId && state.program?.id === d.programId ? state.program.runId : null,

function finishSession() {
  const a = state.active;
  const items = a.items.map(it => ({ exId: it.exId, link: it.link, target: it.target, sets: it.sets.filter(s => s.done).map(s => ({ w: +s.w || 0, r: +s.r || 0, done: true })) })).filter(it => it.sets.length);

      <div class="field"><label class="label" for="guNote">Note</label><input id="guNote" type="text" placeholder="How is it going?"></div>
      <div class="field"><label class="label" for="guTarget">Target</label><input id="guTarget" type="number" step="0.1" value="${esc(g.target)}"></div>
      <button class="btn primary block" type="submit">Save update</button></form>
    ${g.history.length ? `<div class="card"><div class="label">History</div>${g.history.slice().reverse().map(x => `<div class="list-row"><div><div class="small muted">${fmtDL(x.d)}</div>${x.note ? esc(x.note) : ''}</div>${x.v !== '' && x.v != null ? `<strong class="num" style="font-size:17px">${round1(+x.v)}</strong>` : ''}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn" style="flex:1" data-act="goalDone" data-id="${id}">${g.done ? 'Reopen goal' : 'Mark complete'}</button><button class="btn ghost danger" style="flex:1" data-act="goalDel" data-id="${id}">Delete</button></div></div>`);
}
function settingsSheet() {
  openSheet(`<div class="sheet-head"><h2>Settings</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <div class="stack"><div class="card stack" style="gap:8px"><div class="row between"><span>Weight unit</span><div class="seg"><button data-act="unitSet" data-v="kg" aria-pressed="${unit() === 'kg'}">kg</button><button data-act="unitSet" data-v="lb" aria-pressed="${unit() === 'lb'}">lb</button></div></div><div class="small muted">Changes the label only. Numbers you have logged stay as entered.</div></div>
   <div class="card small"><strong>Where your data lives</strong><div class="muted">${Store.mode === 'account' ? 'Saved to your account, so it is there on any device where you open this app signed in.' : STANDALONE ? 'Saved on this phone only. Make a backup now and then so you can restore it if you change phones or clear your browser.' : 'Saved in this browser only. Open the app signed in to keep it on your account.'}</div>
   ${STANDALONE ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-act="backup">Download backup</button><label class="btn sm" for="restoreFile" style="cursor:pointer">Restore from backup</label><input type="file" id="restoreFile" accept="application/json,.json" hidden></div>` : ''}</div>
   <div class="card small"><strong>Library</strong><div class="muted">${EXERCISES.length} exercises across ${TAX.groups.length} muscle groups, ${Object.keys(SG).length} sub-categories and ${Object.keys(M).length} muscles. ${PROGRAMS.length} programs.</div><div class="chips" style="margin-top:8px">${TAX.groups.map(g => gPill(g.id)).join('')}</div></div>
   <button class="btn ghost danger block" data-act="resetAll">Delete all my data</button></div>`);
}
function pickExerciseSheet() {
  openSheet(`<div class="sheet-head"><h2>Add exercise</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">×</button></div>
   <div class="stack"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" id="pickQ" placeholder="Search exercises or muscles" data-input="pickQ" autocomplete="off"></div><div id="pickList" class="stack" style="gap:6px"></div></div>`);
  renderPick('');
}
function renderPick(q) {
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  $('#pickList').innerHTML = EXERCISES.filter(e => w.every(x => e._s.includes(x))).slice(0, 40).map(e => `<button class="btn block" style="justify-content:space-between;text-align:left" data-act="sessPick" data-id="${e.id}"><span>${esc(e.name)}</span><span class="row" style="gap:4px;flex-wrap:nowrap">${e.groups.slice(0, 3).map(g => `<span class="dotc" style="background:${G[g].color}"></span>`).join('')}</span></button>`).join('');
}

// ---------- actions ----------
const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
function removeAt(items, i) { if (i > 0 && items[i - 1].link && !items[i].link) items[i - 1].link = false; items.splice(i, 1); }
const A = {
  tab: d => go(d.id), closeSheet: () => closeSheet(), scrim: (d, el, ev) => { if (ev.target === el) closeSheet(); },
  selG: d => { toggle(ui.selG, d.id); if (!ui.selG.has(d.id)) G[d.id].subgroups.forEach(s => { ui.selSG.delete(s.id); s.muscles.forEach(m => ui.selM.delete(m.id)); }); render(); },
  selSG: d => { toggle(ui.selSG, d.id); if (!ui.selSG.has(d.id)) SG[d.id].muscles.forEach(m => ui.selM.delete(m.id)); render(); },
  selM: d => { toggle(ui.selM, d.id); render(); },
  match: d => { ui.match = d.v; render(); }, scope: d => { ui.scope = d.v; render(); }, more: () => { ui.showMore = !ui.showMore; render(); },
  equip: d => { toggle(ui.equip, d.id); render(); }, type: d => { ui.type = d.v; render(); },
  clearFilters: () => { ui.selG.clear(); ui.selSG.clear(); ui.selM.clear(); ui.equip.clear(); ui.type = 'all'; ui.q = ''; render(); },
  cycleStyle: () => { const o = ['hypertrophy', 'strength', 'endurance']; state.settings.goalStyle = o[(o.indexOf(state.settings.goalStyle) + 1) % 3]; saveState(); render(); },
  setStyle: d => { state.settings.goalStyle = d.v; saveState(); render(); },
  exDetail: d => exDetail(d.id),
  addEx: d => {
    if (state.active) return toast('Add exercises from the workout screen');
    const i = state.draft.items.findIndex(x => x.exId === d.id);
    if (i >= 0) { removeAt(state.draft.items, i); toast('Removed from workout'); }
    else { const r = parseRec(recFor(EX[d.id])); state.draft.items.push({ exId: d.id, sets: r.sets, reps: r.reps, link: false }); toast(`Added · ${state.draft.items.length} in your workout`); }
    saveState(); if (d.close) closeSheet(); if (ui.tab === 'exercises') renderExList(); else render();
  },
  clearDraft: () => confirmSheet('Clear this workout?', 'This removes every exercise from the workout you are building.', () => { state.draft = blankDraft(); saveState(); render(); }, 'Clear workout'),
  moveIt: d => { const it = state.draft.items, i = +d.i, j = i + +d.d; if (j < 0 || j >= it.length) return; [it[i], it[j]] = [it[j], it[i]]; it[it.length - 1].link = false; saveState(); render(); },
  rmIt: d => { removeAt(state.draft.items, +d.i); saveState(); render(); },
  link: d => { state.draft.items[+d.i].link = true; saveState(); render(); },
  unlinkBlock: d => { for (let k = +d.i; k <= +d.j; k++) state.draft.items[k].link = false; saveState(); render(); },
  saveTemplate: () => { const d = state.draft; const name = d.name || defaultName(d.items); const items = d.items.map(({ exId, sets, reps, link }) => ({ exId, sets, reps, link })); const ex = state.templates.find(t => t.name === name); if (ex) ex.items = items; else state.templates.push({ id: uid(), name, items }); saveState(); toast(`Saved "${name}"`); render(); },
  loadTemplate: d => { const t = state.templates.find(x => x.id === d.id); state.draft = { name: t.name, items: t.items.map(x => ({ ...x })), programId: null, dayIndex: null }; saveState(); render(); toast('Loaded ' + t.name); },
  delTemplate: d => { const t = state.templates.find(x => x.id === d.id); confirmSheet(`Delete "${t.name}"?`, 'The saved workout is removed. Logged sessions stay.', () => { state.templates = state.templates.filter(x => x.id !== d.id); saveState(); render(); }, 'Delete'); },
  startSession: () => startSession(),
  coachGo: () => runCoach(0),
  coachShuffle: () => { ui.coachText = state.coach?.prompt || ''; runCoach((Date.now() % 100000) + 7); },
  coachIdea: d => { ui.coachText = d.t; runCoach(0); },
  coachAdd: () => {
    const picks = state.coach.items.filter(i => i.pick !== false);
    if (!picks.length) return toast('Tick at least one exercise');
    const have = new Set(state.draft.items.map(i => i.exId));
    picks.forEach((it, k) => { if (!have.has(it.exId)) state.draft.items.push({ exId: it.exId, sets: it.sets, reps: it.reps, link: !!(it.link && picks[k + 1] && state.coach.items.indexOf(picks[k + 1]) === state.coach.items.indexOf(it) + 1) }); });
    if (state.draft.items.length) state.draft.items[state.draft.items.length - 1].link = false;
    if (!state.draft.name) state.draft.name = defaultName(state.draft.items);
    state.coach = null; saveState(); render(); toast(`${picks.length} exercises added`);
  },
  tick: d => { const it = state.active.items[+d.k], s = it.sets[+d.n]; s.done = !s.done; if (s.done && !it.link) ui.timerEnd = Date.now() + ui.timerDur * 1000; saveState(); render(); },
  addSet: d => { const sets = state.active.items[+d.k].sets; const l = sets[sets.length - 1] || { w: '', r: '' }; sets.push({ w: l.w, r: l.r, done: false }); saveState(); render(); },
  rmSet: d => { state.active.items[+d.k].sets.pop(); saveState(); render(); },
  sessRmEx: d => { removeAt(state.active.items, +d.k); saveState(); render(); },
  sessAddEx: () => pickExerciseSheet(),
  sessPick: d => { const r = parseRec(recFor(EX[d.id])), last = lastSets(d.id); state.active.items.push({ exId: d.id, link: false, target: r.reps, sets: Array.from({ length: r.sets }, () => ({ w: last ? last.top : '', r: firstNum(r.reps), done: false })) }); saveState(); closeSheet(); render(); },
  finishSession: () => finishSession(),
  discardSession: () => confirmSheet('Discard this workout?', 'Nothing from this session will be saved.', () => { state.active = null; ui.timerEnd = 0; saveState(true); render(); }, 'Discard'),
  timerDur: d => { ui.timerDur = +d.s; render(); },
  timerAdd: d => { ui.timerEnd = Math.max(Date.now(), ui.timerEnd) + +d.s * 1000; renderTimer(); }, timerStop: () => { ui.timerEnd = 0; renderTimer(); },
  progCat: d => { ui.progCat = d.v; render(); }, progDetail: d => progDetail(d.id),
  startProgram: d => { const start = $('#progStart')?.value || today(); endProgramRecord(); state.program = { id: d.id, start, runId: uid() }; state.draft = blankDraft(); saveState(true); closeSheet(); go('home'); toast('Program started. Good luck!'); },
  endProgram: () => confirmSheet('End this program?', 'It moves to your past programs. Your logged workouts stay.', () => { endProgramRecord(); saveState(true); render(); }, 'End program'),
  loadProgDay: d => { if (state.active) { closeSheet(); go('workout'); return toast('Finish your current workout first'); } loadProgDay(+d.day); },
  bwSheet: () => bwSheet(), goalSheet: () => goalSheet(), goalUpdate: d => goalUpdateSheet(d.id), settings: () => settingsSheet(),
  delBW: d => { state.bodyweight = state.bodyweight.filter(b => b.date !== d.d); saveState(); render(); bwSheet(); },
  goalDone: d => { const g = state.goals.find(x => x.id === d.id); g.done = !g.done; g.history.push({ d: today(), v: '', note: g.done ? 'Marked complete' : 'Reopened' }); saveState(); closeSheet(); render(); if (g.done) toast('Goal complete. Nice work!'); },
  goalDel: d => confirmSheet('Delete this goal?', 'Its history is removed too.', () => { state.goals = state.goals.filter(x => x.id !== d.id); saveState(); render(); }, 'Delete goal'),
  unitSet: d => { state.settings.unit = d.v; saveState(); render(); settingsSheet(); },
  resetAll: () => confirmSheet('Delete all your data?', 'This removes every workout, weigh-in, goal and program from this app. It cannot be undone.', () => { const old = logs.slice(); state = blankState(); logs = []; saveState(true); old.forEach(l => deleteLog(l.id)); render(); toast('All data deleted'); }, 'Delete everything'),
  delLog: d => confirmSheet('Delete this workout?', 'It is removed from your history, progress charts and program tracking.', () => { logs = logs.filter(l => l.id !== d.id); deleteLog(d.id); render(); }, 'Delete workout'),
  repeatLog: d => { const l = logs.find(x => x.id === d.id); state.draft = { name: l.name, programId: null, dayIndex: null, items: l.items.filter(i => EX[i.exId]).map(i => ({ exId: i.exId, sets: i.sets.length, reps: i.target || String(i.sets[0]?.r || 10), link: !!i.link })) }; if (state.draft.items.length) state.draft.items[state.draft.items.length - 1].link = false; saveState(); go('workout'); },
  backup: () => {
    const blob = new Blob([JSON.stringify({ app: 'duolifto', version: 1, exported: new Date().toISOString(), state, logs })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `duolifto-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
  },
  confirmYes: () => { const f = pendingConfirm; pendingConfirm = null; closeSheet(); f && f(); },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'scrim') ev.preventDefault();
  fn(el.dataset, el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.input; if (!k) return;
  if (k === 'q') { ui.q = el.value; renderExList(); }
  else if (k === 'draftName') { state.draft.name = el.value; saveState(); }
  else if (k === 'itSets') { state.draft.items[+el.dataset.i].sets = el.value; saveState(); }
  else if (k === 'itReps') { state.draft.items[+el.dataset.i].reps = el.value; saveState(); }
  else if (k === 'coachText') ui.coachText = el.value;
  else if (k === 'coachPick') state.coach.items[+el.dataset.i].pick = el.checked;
  else if (k === 'setW') { state.active.items[+el.dataset.k].sets[+el.dataset.n].w = el.value; saveState(); }
  else if (k === 'setR') { state.active.items[+el.dataset.k].sets[+el.dataset.n].r = el.value; saveState(); }
  else if (k === 'progressEx') { ui.progressEx = el.value; render(); }
  else if (k === 'gType') goalTypeChanged();
  else if (k === 'pickQ') renderPick(el.value);
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.input === 'gType') goalTypeChanged();
  if (ev.target.id === 'restoreFile' && ev.target.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.state || !Array.isArray(d.logs)) throw 0; confirmSheet('Restore this backup?', `It has ${d.logs.length} workouts from ${String(d.exported || '').slice(0, 10) || 'an earlier date'}. It replaces everything currently in the app.`, () => { state = normalize(d.state); logs = d.logs; sortLogs(); lsSet(); render(); toast('Backup restored'); }, 'Restore'); } catch { toast('That file is not a Duolifto backup'); } };
    r.readAsText(ev.target.files[0]);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'coachText' && !ev.shiftKey) { ev.preventDefault(); runCoach(0); } if (ev.key === 'Escape') closeSheet(); });
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.dataset.form === 'bw') {
    const kg = parseFloat($('#bwKg').value), date = $('#bwDate').value || today(); if (!(kg > 0)) return;
    state.bodyweight = state.bodyweight.filter(b => b.date !== date).concat({ date, kg }).sort((a, b) => a.date < b.date ? -1 : 1);
    saveState(); closeSheet(); render(); toast(`Logged ${kg} ${unit()}`);
  } else if (f.dataset.form === 'goal') {
    const type = $('#gType').value, target = parseFloat($('#gTarget').value); if (isNaN(target)) return;
    const g = { id: uid(), type, target, created: today(), deadline: $('#gDeadline').value || null, history: [], done: false };
    if (type === 'bodyweight') { const b = latestBW(); g.start = b ? b.kg : target; g.title = `Reach ${target} ${unit()} body weight`; if (!b) setTimeout(() => toast('Log your body weight to track this goal'), 2500); }
    else if (type === 'lift') { g.exId = $('#gEx').value; g.start = bestTop(g.exId) || 0; g.title = `${EX[g.exId].name}: ${target} ${unit()}`; }
    else if (type === 'attendance') { g.start = 0; g.title = `Train ${target} days a week`; }
    else { g.start = parseFloat($('#gStart').value) || 0; g.unit = $('#gUnit').value.trim(); g.title = $('#gTitle').value.trim() || `Reach ${target}${g.unit ? ' ' + g.unit : ''}`; }
    g.history.push({ d: today(), v: g.start, note: 'Goal set' });
    state.goals.push(g); saveState(); closeSheet(); render(); toast('Goal added');
  } else if (f.dataset.form === 'goalUpd') {
    const g = state.goals.find(x => x.id === f.dataset.id); const v = $('#guVal') ? $('#guVal').value : ''; const note = $('#guNote').value.trim(); const nt = parseFloat($('#guTarget').value);
    if (!isNaN(nt) && nt !== +g.target) { g.history.push({ d: today(), v: '', note: `Target changed from ${g.target} to ${nt}` }); g.target = nt; }
    if (v !== '' || note) g.history.push({ d: today(), v: v === '' ? (g.type === 'custom' ? '' : goalProgress(g).current) : +v, note });
    const p = goalProgress(g); saveState(); closeSheet(); render(); toast(p.pct >= 100 ? 'Target reached! Mark it complete when you are ready.' : 'Goal updated');
  }
});

// ---------- boot ----------
const h0 = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h0)) ui.tab = h0;
initStore();
if (window.claude?.use) claude.use('sample').then(s => { if (s) { sampleFn = s; if (ui.tab === 'workout' && !state.active) render(); } }).catch(() => {});
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
