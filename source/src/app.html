<title>Duolifto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single-column phone app, sticky header, fixed bottom tab bar; muscle colours carry the colour, UI chrome stays iron grey */
:root {
  --bg: #eef0f2; --surface: #ffffff; --surface-2: #e4e7eb; --fg: #14171c; --muted: #5a616d; --line: #d3d7dd;
  --ink: #14171c; --on-ink: #f6f7f8;
  --good: #1d8148; --act: #6a4fc8; --warn: #a86a12; --bad: #b8322a;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #22262d; --fg: #eceef1; --muted: #9aa1ac; --line: #2b3038;
  --ink: #eceef1; --on-ink: #121418; --good: #3fbf74; --act: #a58cf2; --warn: #e0a43c; --bad: #ef6a5f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #22262d; --fg: #eceef1; --muted: #9aa1ac; --line: #2b3038;
  --ink: #eceef1; --on-ink: #121418; --good: #3fbf74; --act: #a58cf2; --warn: #e0a43c; --bad: #ef6a5f; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 18px; font-weight: 600; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { max-width: 760px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top .brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.plate { width: 22px; height: 22px; border-radius: 50%; border: 5px solid var(--fg); position: relative; }
.plate::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--fg); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--good); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 10px; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
nav.tabs .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card.flat { background: transparent; border-style: dashed; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; min-height: 40px; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger, .link.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; flex: none; font-weight: 700; font-size: 18px; line-height: 1; }
.iconbtn.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-height: 40px; }
textarea { resize: vertical; min-height: 64px; }
[hidden] { display: none !important; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Muscle chips: group = solid, sub-category = mid shade, muscle = light tint */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--ink); color: var(--on-ink); }
.chip.tier { background: transparent; border-color: var(--c); color: var(--fg); }
.chip.tier::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip.tier[aria-pressed="true"] { background: var(--c); color: var(--t); }
.chip.tier[aria-pressed="true"]::before { background: var(--t); opacity: .7; }
.chip.t2 { font-size: 12.5px; }
.chip.t3 { font-size: 12px; padding: 4px 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; background: var(--c, var(--surface-2)); color: var(--t, var(--fg)); white-space: nowrap; }
.pill.out { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.dotc { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }

.search { position: relative; }
.search input { padding-left: 36px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }

.exlist { display: flex; flex-direction: column; gap: 8px; }
.ex { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 10px 0; overflow: hidden; }
.ex .strip { align-self: stretch; display: flex; flex-direction: column; margin: -10px 0; }
.ex .strip i { flex: 1; }
.ex .body { min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.ex .name { font-weight: 600; font-size: 15.5px; }
.ex .meta { font-size: 12.5px; color: var(--muted); }
.ex .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.rec { font-family: var(--font-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.bar { height: 8px; background: var(--surface-2); border-radius: 999px; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 999px; }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; color: var(--muted); font-weight: 600; }

.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal b { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
.cal button, .cal span { aspect-ratio: 1; max-height: 52px; width: 100%; border-radius: 8px; border: 0; background: var(--surface-2); color: var(--fg); font: 600 13px/1 var(--font-body); font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; padding: 0; min-width: 0; }
.cal .on { background: var(--good); color: var(--surface); } .cal .act { background: var(--act); color: var(--surface); }
.cal .both { background: linear-gradient(135deg, var(--good) 50%, var(--act) 50%); color: var(--surface); }
.cal .today { outline: 2px solid var(--fg); outline-offset: -2px; }
.cal .future { background: transparent; color: var(--muted); opacity: .45; }
.heatkey { display: inline-flex; align-items: center; gap: 5px; } .heatkey i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.actbars .list-row { gap: 10px; } .actbars .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; } .actbars .bar i { display: block; height: 100%; background: var(--act); border-radius: 4px; }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--fg); opacity: .07; }
.chart .pt { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
.chart .tg { stroke: var(--good); stroke-dasharray: 4 4; stroke-width: 1.5; }

/* Coach chat */
.coach { background: var(--ink); color: var(--on-ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.coach .bubble { background: color-mix(in srgb, var(--on-ink) 10%, transparent); border-radius: 12px 12px 12px 4px; padding: 9px 12px; font-size: 14px; max-width: 92%; }
.coach .bubble.me { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: color-mix(in srgb, var(--on-ink) 22%, transparent); }
.coach textarea { background: color-mix(in srgb, var(--on-ink) 8%, transparent); color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 25%, transparent); min-height: 54px; }
.coach textarea::placeholder { color: color-mix(in srgb, var(--on-ink) 55%, transparent); }
.coach .btn.primary { background: var(--on-ink); color: var(--ink); border-color: var(--on-ink); }
.coach .btn.ghost { color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 30%, transparent); }
.coach .ideas { display: flex; gap: 6px; flex-wrap: wrap; }
.chatlog { display: flex; flex-direction: column; gap: 8px; max-height: min(52vh, 440px); overflow-y: auto; overscroll-behavior: contain; }
.sheet .chatlog { max-height: 60vh; }
.coach .changes { align-self: flex-start; font-size: 12.5px; opacity: .85; display: flex; flex-direction: column; gap: 2px; padding-left: 4px; }
.coach .link { color: var(--on-ink); font-size: 12.5px; align-self: flex-start; }
.coach .iconbtn { background: transparent; color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 30%, transparent); width: 32px; height: 32px; }
.coach .typing { opacity: .7; font-style: italic; }
.chat-in { display: flex; gap: 8px; align-items: flex-end; } .chat-in textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; } .chat-in .btn { flex: none; min-height: 44px; }
.coach .ideas button { background: transparent; border: 1px solid color-mix(in srgb, var(--on-ink) 30%, transparent); color: var(--on-ink); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; text-align: left; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg label { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.sugg input { width: 18px; height: 18px; accent-color: var(--fg); }
.sugg .why { font-size: 12.5px; color: var(--muted); }

/* Builder / session */
.block { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.block.ss { border-left: 4px solid var(--fg); }
.block .ss-head { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 9px 12px 0; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.block .ss-head .link { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--muted); }
.bitem { padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.bitem + .bitem { border-top: 1px dashed var(--line); }
.tagid { font-family: var(--font-display); font-weight: 700; font-size: 17px; width: 30px; text-align: center; }
.bitem .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bitem .ctl input { width: 60px; text-align: center; padding: 6px; min-height: 34px; }
.moves { display: flex; flex-direction: column; gap: 4px; }
.moves .iconbtn { width: 32px; height: 30px; font-size: 15px; }
.linker { display: flex; justify-content: center; }
.linker button { font-size: 12px; font-weight: 600; border: 1px dashed var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 3px 12px; }
.sets { display: grid; grid-template-columns: 34px 1fr 1fr 44px; gap: 6px 8px; align-items: center; padding: 0 12px 12px; }
.sets .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; }
.sets input { text-align: center; padding: 7px 4px; min-height: 42px; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.sets .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: center; }
.tick { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); }
.tick svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 3; fill: none; opacity: .25; }
.tick.on { background: var(--good); border-color: var(--good); color: #fff; }
.tick.on svg { opacity: 1; }
.sets .done input { opacity: .6; }
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 31; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); white-space: nowrap; }
.timer .num { font-size: 22px; font-weight: 700; min-width: 50px; }
.timer button { background: color-mix(in srgb, var(--on-ink) 14%, transparent); color: var(--on-ink); border: 0; border-radius: 999px; padding: 6px 10px; font-weight: 600; font-size: 13px; }

/* Programs */
.phases { display: flex; gap: 3px; }
.phases > div { flex: var(--w); min-width: 0; }
.phases .seg-bar { height: 10px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.phases .seg-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.phases .pl { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phases .cur .pl { color: var(--fg); font-weight: 600; }
.progcard { cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.cat { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.mix { display: flex; height: 6px; border-radius: 4px; overflow: hidden; }
.dayex { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.dayex div { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; font-size: 14px; align-items: baseline; }
.dayex .ssl { font-family: var(--font-display); font-weight: 700; color: var(--muted); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.tree { display: flex; flex-direction: column; gap: 10px; }
.tree .g { display: flex; flex-direction: column; gap: 6px; }
.tree .s { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--on-ink); padding: 9px 16px; border-radius: 999px; z-index: 60; font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 22px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.list-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.list-row:first-child { border-top: 0; }
.goal { display: flex; flex-direction: column; gap: 8px; }
.goal + .goal { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist td, table.hist th { padding: 7px 6px; border-top: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
table.hist th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
.tablewrap { overflow-x: auto; }
details summary { cursor: pointer; }
.bmrow { display: flex; gap: 10px; justify-content: center; }
.bmv { margin: 0; flex: 1; max-width: 220px; min-width: 0; text-align: center; }
.bodymap { width: 100%; height: auto; max-height: 230px; display: block; }
.bodymap .sil { fill: var(--surface-2); }
.bodymap .mu { fill: color-mix(in srgb, var(--fg) 9%, var(--surface-2)); stroke: var(--surface); stroke-width: .8; }
.bodymap .hl { stroke: var(--surface); stroke-width: .8; }
.bmv figcaption, .mv figcaption { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mvrow { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 8px; }
.mvseq { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 31%); gap: 6px; overflow-x: auto; background: var(--surface-2); border-radius: 10px; padding: 8px; scroll-snap-type: x mandatory; }
.mvseq .mv { scroll-snap-align: start; background: var(--surface); border-radius: 8px; padding: 4px; }
.mvrow.one { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto; width: 100%; }
.mv { margin: 0; text-align: center; min-width: 0; }
.mv svg { width: 100%; height: auto; display: block; }
.mv .bone { stroke: var(--fg); stroke-width: 5; stroke-linecap: round; }
.mv .bone.far { opacity: .35; }
.mv .headc { fill: var(--fg); }
.mv .floor { stroke: var(--line); stroke-width: 2; }
.mv .pad { fill: none; stroke: var(--line); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.benchtag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--surface-2); border-radius: 999px; padding: 4px 10px 4px 8px; align-self: flex-start; }

      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>

<nav class="tabs" id="tabs"></nav>

<div id="toast"></div>

<script>
/*__DATA__*/
/*__VISUALS__*/

// ---------- indexes ----------
const G = {}, SG = {}, M = {}, EX = {};
TAX.groups.forEach(g => { G[g.id] = g; g.subgroups.forEach(s => { s.group = g.id; SG[s.id] = s; s.muscles.forEach(m => { m.sub = s.id; m.group = g.id; M[m.id] = m; }); }); });
EXERCISES.forEach(e => {
  EX[e.id] = e;
  e._s = [e.name, e.tags.join(' '), TAX.equipment[e.equipment], TAX.patterns[e.pattern], e.type,
    e.primary.concat(e.secondary).map(m => M[m].name).join(' '), e.subgroups.map(s => SG[s].name).join(' '), e.groups.map(g => G[g].name).join(' ')].join(' ').toLowerCase();
  e._p = (e.name + ' ' + e.primary.map(m => M[m].name + ' ' + SG[M[m].sub].name + ' ' + G[M[m].group].name).join(' ')).toLowerCase();
});
const PROG = {}; PROGRAMS.forEach(p => PROG[p.id] = p);
const groupMuscles = id => G[id].subgroups.flatMap(s => s.muscles.map(m => m.id));
const subMuscles = id => SG[id].muscles.map(m => m.id);

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const fmtD = s => parseD(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtDL = s => parseD(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const mondayOf = s => { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dstr(d); };
const textOn = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14171c' : '#ffffff'; };
const cvars = hex => `--c:${hex};--t:${textOn(hex)}`;
const e1rm = (w, r) => (!w || !r) ? 0 : r <= 1 ? w : w * (1 + Math.min(r, 12) / 30);
const round1 = n => Math.round(n * 10) / 10;
const unit = () => state.settings.unit || 'kg';
const STYLE_NAMES = { strength: 'Strength', hypertrophy: 'Size', endurance: 'Endurance' };
function parseRec(s) { const m = String(s).match(/^(\d+)\s*x\s*(.+)$/i); return m ? { sets: +m[1], reps: m[2].trim() } : { sets: 3, reps: '10' }; }
function firstNum(s) { const m = String(s ?? '').match(/\d+/); return m ? +m[0] : ''; }
function toast(msg) { const t = $('#toast'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = '', 2400); }
function blocksOf(items) { const out = []; let i = 0; while (i < items.length) { let j = i; while (j + 1 < items.length && items[j].link) j++; out.push([i, j]); i = j + 1; } return out; }
function ssLabels(items) { const out = []; blocksOf(items).forEach(([i, j], b) => { const L = String.fromCharCode(65 + b); for (let k = i; k <= j; k++) out[k] = j > i ? L + (k - i + 1) : L; }); return out; }

// ---------- storage ----------
const LS_KEY = 'ironlog.v1';
const STANDALONE = !!window.__STANDALONE__;
const blankDraft = () => ({ name: '', items: [], programId: null, dayIndex: null });
const blankState = () => ({ bodyweight: [], goals: [], program: null, programHistory: [], templates: [], draft: blankDraft(), active: null, settings: { unit: 'kg', goalStyle: 'hypertrophy' }, coach: null, customPrograms: [], askSave: null, chat: [] });
let state = blankState();
let logs = [];
const Store = { col: null, mode: 'local', queue: Promise.resolve(), timer: null };
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; } }
function lsSet() { try { localStorage.setItem(LS_KEY, JSON.stringify({ state, logs })); } catch {} }
function normalize(s) { const b = blankState(); s = Object.assign(b, s || {}); s.settings = Object.assign(blankState().settings, s.settings || {}); s.draft = Object.assign(blankDraft(), s.draft || {}); s.chat = (Array.isArray(s.chat) ? s.chat : []).filter(m => m && !m.pending && (m.text || m.items)); return s; }
function enqueue(fn) { Store.queue = Store.queue.then(fn).then(() => setSync(true, 'Synced')).catch(err => { console.warn('save failed', err); setSync(false, 'Saved on this device'); }); return Store.queue; }
function saveState(immediate) {
  lsSet();
  if (!Store.col) return;
  clearTimeout(Store.timer);
  const go = () => enqueue(() => Store.col.doc('state').set({ kind: 'state', json: JSON.stringify(state), updated: Date.now() }));
  if (immediate) go(); else Store.timer = setTimeout(go, 900);
}
function saveLog(log) { lsSet(); if (Store.col) enqueue(() => Store.col.doc('log-' + log.id).set({ kind: 'log', date: log.date, json: JSON.stringify(log) })); }
function deleteLog(id) { lsSet(); if (Store.col) enqueue(() => Store.col.doc('log-' + id).delete()); }
function setSync(on, text) { const el = $('#sync'); el.className = 'sync' + (on ? ' on' : ''); el.querySelector('span').textContent = text; }
const sortLogs = () => logs.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ended || 0) - (b.ended || 0));
async function initStore() {
  const cached = lsGet();
  if (cached) { state = normalize(cached.state); logs = cached.logs || []; }
  render();
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const col = db.collection('data/users/' + id);
    const snap = await col.get();
    let remoteState = null; const remoteLogs = [];
    snap.docs.forEach(d => { const v = d.data() || {}; try { if (d.id === 'state') remoteState = JSON.parse(v.json); else if (v.kind === 'log') remoteLogs.push(JSON.parse(v.json)); } catch {} });
    Store.col = col; Store.mode = 'account';
    if (remoteState || remoteLogs.length) {
      state = normalize(remoteState || state);
      const ids = new Set(remoteLogs.map(l => l.id));
      const localOnly = logs.filter(l => !ids.has(l.id));
      logs = remoteLogs.concat(localOnly);
      localOnly.forEach(saveLog);
    } else if (cached) { saveState(true); logs.forEach(saveLog); }
    sortLogs(); lsSet();
    setSync(true, 'Synced');
    if (!document.querySelector('.scrim')) render();
  } catch (err) { console.warn('db unavailable', err); }
}

// ---------- derived data ----------
function exHistory(exId) {
  const out = [];
  logs.forEach(l => l.items.forEach(it => {
    if (it.exId !== exId) return;
    const sets = it.sets.filter(s => s.done && (+s.r > 0));
    if (!sets.length) return;
    out.push({ date: l.date, top: Math.max(...sets.map(s => +s.w || 0)), best: Math.max(...sets.map(s => e1rm(+s.w || 0, +s.r))), vol: sets.reduce((a, s) => a + (+s.w || 0) * (+s.r || 0), 0), sets });
  }));
  return out;
}
function lastSets(exId) { const h = exHistory(exId); return h.length ? h[h.length - 1] : null; }
function bestTop(exId) { return exHistory(exId).reduce((b, h) => Math.max(b, h.top), 0); }
function latestBW() { const b = state.bodyweight; return b.length ? b[b.length - 1] : null; }
function sessionsBetween(a, b) { return new Set(logs.filter(l => l.date >= a && l.date <= b).map(l => l.date)).size; }
function weekStreak() {
  const set = new Set(logs.map(l => mondayOf(l.date)));
  let wk = mondayOf(today()), n = 0;
  if (!set.has(wk)) wk = addDays(wk, -7);
  while (set.has(wk)) { n++; wk = addDays(wk, -7); }
  return n;
}
function programStatus() {
  const p = state.program; if (!p) return null;
  const def = PROG[p.id]; if (!def) return null;
  const days = Math.max(0, daysBetween(p.start, today()));
  const total = def.weeks * def.daysPerWeek;
  const week = Math.min(def.weeks, Math.floor(days / 7) + 1);
  const finished = days >= def.weeks * 7;
  const pl = logs.filter(l => l.programId === p.id && l.date >= p.start && (!p.runId || !l.runId || l.runId === p.runId));
  const expected = Math.min(total, Math.round((Math.min(days, def.weeks * 7) / 7) * def.daysPerWeek));
  const phase = def.phases.find(ph => week >= ph.weeks[0] && week <= ph.weeks[1]) || def.phases[def.phases.length - 1];
  const last = pl[pl.length - 1];
  const nextDay = last && last.dayIndex != null ? (last.dayIndex + 1) % def.days.length : 0;
  const perWeek = Array.from({ length: def.weeks }, (_, i) => pl.filter(l => Math.floor(daysBetween(p.start, l.date) / 7) === i).length);
  return { def, p, days, week, finished, done: pl.length, total, expected, adherence: expected ? Math.min(100, Math.round(pl.length / expected * 100)) : null, phase, nextDay, perWeek, thisWeek: perWeek[week - 1] || 0 };
}
function goalProgress(g) {
  let start = +g.start || 0, target = +g.target || 0, current = start;
  if (g.type === 'bodyweight') { const b = latestBW(); current = b ? b.kg : start; }
  else if (g.type === 'lift') { current = bestTop(g.exId) || start; }
  else if (g.type === 'attendance') { const m = mondayOf(today()); current = sessionsBetween(m, addDays(m, 6)); start = 0; }
  else { const h = g.history.filter(x => x.v !== '' && x.v != null); current = h.length ? +h[h.length - 1].v : start; }
  const span = target - start;
  const pct = span === 0 ? (current === target ? 100 : 0) : Math.max(0, Math.min(100, Math.round((current - start) / span * 100)));
  return { start, target, current, pct };
}

// ---------- charts ----------
function lineChart(pts, { h = 150, target = null, unitLabel = '' } = {}) {
  if (!pts.length) return '';
  const W = 600, H = h, L = 44, R = 14, T = 14, B = 24;
  const xs = pts.map(p => parseD(p.x).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  const ys = pts.map(p => p.y).concat(target != null && !isNaN(target) ? [+target] : []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05); y0 -= padY; y1 += padY;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">`;
  [y0 + padY, (y0 + y1) / 2, y1 - padY].forEach(v => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${round1(v)}</text>`; });
  if (target != null && !isNaN(target)) s += `<line class="tg" x1="${L}" x2="${W - R}" y1="${Y(+target)}" y2="${Y(+target)}"/><text x="${W - R}" y="${Y(+target) - 5}" text-anchor="end">Goal ${round1(+target)}${unitLabel}</text>`;
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  s += `<path class="area" d="${path} L${X(xs[xs.length - 1]).toFixed(1)} ${H - B} L${X(xs[0]).toFixed(1)} ${H - B} Z"/><path class="ln" d="${path}"/>`;
  pts.forEach((p, i) => { if (pts.length <= 30 || i === pts.length - 1) s += `<circle class="pt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`; });
  s += `<text x="${L}" y="${H - 6}">${fmtD(pts[0].x)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtD(pts[pts.length - 1].x)}</text></svg>`;
  return s;
}
function barChart(vals, target, labels) {
  const W = 600, H = 120, L = 6, B = 20, T = 14, n = vals.length, gap = 6;
  const max = Math.max(target, ...vals, 1), bw = (W - L * 2 - gap * (n - 1)) / n;
  const Y = v => T + (1 - v / max) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions per week"><line class="tg" x1="0" x2="${W}" y1="${Y(target)}" y2="${Y(target)}"/>`;
  vals.forEach((v, i) => { const x = L + i * (bw + gap); s += `<rect x="${x}" y="${v ? Y(v) : H - B - 2}" width="${bw}" height="${v ? H - B - Y(v) : 2}" rx="3" style="fill:${v >= target ? 'var(--good)' : 'var(--fg)'};opacity:${v ? 1 : .2}"/>${v ? `<text x="${x + bw / 2}" y="${Y(v) - 3}" text-anchor="middle">${v}</text>` : ''}<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${labels[i]}</text>`; });
  return s + '</svg>';
}

// ---------- UI state ----------
const ui = { tab: 'home', q: '', selG: new Set(), selSG: new Set(), selM: new Set(), match: 'any', scope: 'primary', equip: new Set(), type: 'all', showMore: false, progCat: 'All', progressEx: null, chatText: '', chatBusy: false, calMonth: null, timerEnd: 0, timerDur: 90 };
const TABS = [
  ['home', 'Home', '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
  ['exercises', 'Exercises', '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'],
  ['workout', 'Workout', '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'],
  ['programs', 'Programs', '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'],
  ['progress', 'Progress', '<path d="M3 20h18M6 16l4-5 4 3 6-8"/>']];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label, icon]) => `<button data-act="tab" data-id="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24">${icon}</svg>${label}${id === 'workout' && state.active ? '<span class="dot" aria-label="Workout in progress"></span>' : ''}</button>`).join('');
}
function render() {
  (state.customPrograms || []).forEach(p => PROG[p.id] = p);
  renderTabs();
  $('#view').innerHTML = ({ home: viewHome, exercises: viewExercises, workout: viewWorkout, programs: viewPrograms, progress: viewProgress })[ui.tab]();
  if (ui.tab === 'exercises') renderExList();
  document.querySelectorAll('#view .chatlog').forEach(el => el.scrollTop = el.scrollHeight);
  renderTimer();
  const cur = state.program && PROG[state.program.id];
  if (cur?.custom && !cur.saved && !cur.declined && !state.askSave && daysBetween(state.program.start, today()) >= cur.weeks * 7) { state.askSave = cur.id; ui.askedSave = false; }
  if (state.askSave && !ui.askedSave && !document.querySelector('.scrim')) askSaveSheet();
}
function go(tab) { ui.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch {} render(); window.scrollTo(0, 0); }

// ---------- chips ----------
const tierChip = (cls, act, o, on) => `<button class="chip tier ${cls}" style="${cvars(o.color)}" aria-pressed="${on}" data-act="${act}" data-id="${o.id}">${esc(o.name)}</button>`;
const gPill = id => `<span class="pill" style="${cvars(G[id].color)}">${esc(G[id].name)}</span>`;
const sPill = id => `<span class="pill" style="${cvars(SG[id].color)}">${esc(SG[id].name)}</span>`;
const mPill = (id, sec) => `<span class="pill" style="${cvars(M[id].color)}">${esc(M[id].name)}${sec ? ' · 2°' : ''}</span>`;
const strip = e => `<div class="strip">${e.groups.map((g, i) => `<i style="background:${G[g].color};flex:${i ? 1 : 2.5}"></i>`).join('')}</div>`;
const recFor = e => e.rec[state.settings.goalStyle] || e.rec.default;

// ---------- HOME ----------
function viewHome() {
  const t = today(), m = mondayOf(t);
  const wk = sessionsBetween(m, addDays(m, 6));
  const mo = sessionsBetween(t.slice(0, 8) + '01', t);
  const ps = programStatus();
  const bw = latestBW();
  const bw30 = state.bodyweight.filter(b => b.date >= addDays(t, -30));
  const bwDelta = bw && bw30.length > 1 ? round1(bw.kg - bw30[0].kg) : null;
  const hr = new Date().getHours(), greet = hr < 12 ? 'Morning' : hr < 18 ? 'Afternoon' : 'Evening';
  let h = `<div class="stack"><div><div class="label">${fmtDL(t)}</div><h1>${greet}. ${state.active ? 'Workout in progress.' : ps && !ps.finished ? `Week ${ps.week} of ${ps.def.weeks}.` : 'Ready to train?'}</h1></div>`;
  if (state.active) h += `<button class="btn primary block" data-act="tab" data-id="workout">Resume ${esc(state.active.name || 'workout')}</button>`;
  else if (ps && !ps.finished) h += `<button class="btn primary block" data-act="loadProgDay" data-day="${ps.nextDay}">Start next: ${esc(ps.def.days[ps.nextDay].name)}</button>`;
  else h += `<div class="row"><button class="btn primary" style="flex:1" data-act="tab" data-id="workout">Build a workout</button><button class="btn" style="flex:1" data-act="tab" data-id="programs">Pick a program</button></div>`;
  h += `<button class="btn ghost block" data-act="activitySheet">+ Log other activity (walk, run, Pilates, yoga…)</button>`;
  const wkAct = new Set(logs.filter(l => isAct(l) && l.date >= m && l.date <= t).map(l => l.date)).size;
  h += `<div class="grid2">
    <div class="card stat"><div class="label">This week</div><div class="v">${wk}<small>days</small></div>${wkAct ? `<div class="small muted">Includes ${wkAct} activity day${wkAct > 1 ? 's' : ''}</div>` : ''}</div>
    <div class="card stat"><div class="label">This month</div><div class="v">${mo}<small>days</small></div></div>
    <div class="card stat"><div class="label">Week streak</div><div class="v">${weekStreak()}<small>wks</small></div></div>
    <div class="card stat" data-act="bwSheet" style="cursor:pointer"><div class="label">Body weight</div><div class="v">${bw ? round1(bw.kg) : '–'}<small>${unit()}</small></div><div class="small muted">${bwDelta != null ? `${bwDelta > 0 ? '+' : ''}${bwDelta} ${unit()} in 30 days` : bw ? 'Logged ' + fmtD(bw.date) : 'Tap to log'}</div></div>
  </div>`;
  h += `<div class="section-head"><h2>Current program</h2><button class="link small" data-act="tab" data-id="programs">${ps ? 'Details' : 'Browse'}</button></div>`;
  h += ps ? programCard(ps) : `<div class="card flat empty"><div><strong>No program running</strong><div class="muted small">Pick an 8-week block, a 3-week loading phase, a bulk or a cut. Your progress through it shows here.</div></div><button class="btn" data-act="tab" data-id="programs">See programs</button></div>`;
  h += `<div class="section-head"><h2>Goals</h2><button class="link small" data-act="goalSheet">Add goal</button></div>`;
  const open = state.goals.filter(g => !g.done), done = state.goals.filter(g => g.done);

  if (k === 'q') { ui.q = el.value; renderExList(); }
  else if (k === 'draftName') { state.draft.name = el.value; saveState(); }
  else if (k === 'itSets') { state.draft.items[+el.dataset.i].sets = el.value; saveState(); }
  else if (k === 'itReps') { state.draft.items[+el.dataset.i].reps = el.value; saveState(); }
  else if (k === 'chatText') { ui.chatText = el.value; el.style.height = 'auto'; el.style.height = Math.min(140, el.scrollHeight) + 'px'; }
  else if (k === 'chatPick') { const m = chatMsgs()[+el.dataset.m]; if (m?.items?.[+el.dataset.i]) m.items[+el.dataset.i].pick = el.checked; }
  else if (k === 'setW') { state.active.items[+el.dataset.k].sets[+el.dataset.n].w = el.value; saveState(); }
  else if (k === 'setR') { state.active.items[+el.dataset.k].sets[+el.dataset.n].r = el.value; saveState(); }
  else if (k === 'progressEx') { ui.progressEx = el.value; render(); }
  else if (k === 'gType') goalTypeChanged();
  else if (k === 'pickQ') renderPick(el.value);
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.input === 'gType') goalTypeChanged();
  if (ev.target.id === 'restoreFile' && ev.target.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.state || !Array.isArray(d.logs)) throw 0; confirmSheet('Restore this backup?', `It has ${d.logs.length} workouts from ${String(d.exported || '').slice(0, 10) || 'an earlier date'}. It replaces everything currently in the app.`, () => { state = normalize(d.state); logs = d.logs; sortLogs(); lsSet(); render(); toast('Backup restored'); }, 'Restore'); } catch { toast('That file is not a Duolifto backup'); } };
    r.readAsText(ev.target.files[0]);
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'chatText' && !ev.shiftKey) { ev.preventDefault(); chatSend(); } if (ev.key === 'Escape') closeSheet(); });
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.dataset.form === 'bw') {
    const kg = parseFloat($('#bwKg').value), date = $('#bwDate').value || today(); if (!(kg > 0)) return;
    state.bodyweight = state.bodyweight.filter(b => b.date !== date).concat({ date, kg }).sort((a, b) => a.date < b.date ? -1 : 1);
    saveState(); closeSheet(); render(); toast(`Logged ${kg} ${unit()}`);
  } else if (f.dataset.form === 'goal') {
    const type = $('#gType').value, target = parseFloat($('#gTarget').value); if (isNaN(target)) return;
    const g = { id: uid(), type, target, created: today(), deadline: $('#gDeadline').value || null, history: [], done: false };
    if (type === 'bodyweight') { const b = latestBW(); g.start = b ? b.kg : target; g.title = `Reach ${target} ${unit()} body weight`; if (!b) setTimeout(() => toast('Log your body weight to track this goal'), 2500); }
    else if (type === 'lift') { g.exId = $('#gEx').value; g.start = bestTop(g.exId) || 0; g.title = `${EX[g.exId].name}: ${target} ${unit()}`; }
    else if (type === 'attendance') { g.start = 0; g.title = `Train ${target} days a week`; }
    else { g.start = parseFloat($('#gStart').value) || 0; g.unit = $('#gUnit').value.trim(); g.title = $('#gTitle').value.trim() || `Reach ${target}${g.unit ? ' ' + g.unit : ''}`; }
    g.history.push({ d: today(), v: g.start, note: 'Goal set' });
    state.goals.push(g); saveState(); closeSheet(); render(); toast('Goal added');
  } else if (f.dataset.form === 'goalUpd') {
    const g = state.goals.find(x => x.id === f.dataset.id); const v = $('#guVal') ? $('#guVal').value : ''; const note = $('#guNote').value.trim(); const nt = parseFloat($('#guTarget').value);
    if (!isNaN(nt) && nt !== +g.target) { g.history.push({ d: today(), v: '', note: `Target changed from ${g.target} to ${nt}` }); g.target = nt; }
    if (v !== '' || note) g.history.push({ d: today(), v: v === '' ? (g.type === 'custom' ? '' : goalProgress(g).current) : +v, note });
    const p = goalProgress(g); saveState(); closeSheet(); render(); toast(p.pct >= 100 ? 'Target reached! Mark it complete when you are ready.' : 'Goal updated');
  }
});

// ---------- boot ----------
const h0 = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h0)) ui.tab = h0;
initStore();
if (window.claude?.use) claude.use('sample').then(s => { if (s) { sampleFn = s; if (ui.tab === 'workout' && !state.active) render(); } }).catch(() => {});
// Dates come from the phone's clock: when the app is reopened on a new day, redraw so "today" moves on
let shownDay = today();
const dayCheck = () => { if (today() === shownDay) return; shownDay = today(); ui.calMonth = null; if (!document.querySelector('.scrim')) render(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });
window.addEventListener('focus', dayCheck); window.addEventListener('pageshow', dayCheck); setInterval(dayCheck, 60000);
</script>
