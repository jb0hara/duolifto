<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Duolifto: exercise library, workout builder, weight tracking, goals and programs.">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Duolifto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single-column phone app, sticky header, fixed bottom tab bar; muscle colours carry the colour, UI chrome stays iron grey */
:root {
  --bg: #eef0f2; --surface: #ffffff; --surface-2: #e4e7eb; --fg: #14171c; --muted: #5a616d; --line: #d3d7dd;
  --ink: #14171c; --on-ink: #f6f7f8;
  --good: #1d8148; --warn: #a86a12; --bad: #b8322a;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #22262d; --fg: #eceef1; --muted: #9aa1ac; --line: #2b3038;
  --ink: #eceef1; --on-ink: #121418; --good: #3fbf74; --warn: #e0a43c; --bad: #ef6a5f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #22262d; --fg: #eceef1; --muted: #9aa1ac; --line: #2b3038;
  --ink: #eceef1; --on-ink: #121418; --good: #3fbf74; --warn: #e0a43c; --bad: #ef6a5f; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 18px; font-weight: 600; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.app { max-width: 760px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top .brand { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.plate { width: 22px; height: 22px; border-radius: 50%; border: 5px solid var(--fg); position: relative; }
.plate::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--fg); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--good); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); border-radius: 10px; position: relative; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
nav.tabs .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card.flat { background: transparent; border-style: dashed; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; min-height: 40px; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger, .link.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; flex: none; font-weight: 700; font-size: 18px; line-height: 1; }
.iconbtn.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-height: 40px; }
textarea { resize: vertical; min-height: 64px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Muscle chips: group = solid, sub-category = mid shade, muscle = light tint */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: var(--ink); color: var(--on-ink); }
.chip.tier { background: transparent; border-color: var(--c); color: var(--fg); }
.chip.tier::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip.tier[aria-pressed="true"] { background: var(--c); color: var(--t); }
.chip.tier[aria-pressed="true"]::before { background: var(--t); opacity: .7; }
.chip.t2 { font-size: 12.5px; }
.chip.t3 { font-size: 12px; padding: 4px 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; background: var(--c, var(--surface-2)); color: var(--t, var(--fg)); white-space: nowrap; }
.pill.out { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.dotc { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }

.search { position: relative; }
.search input { padding-left: 36px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }

.exlist { display: flex; flex-direction: column; gap: 8px; }
.ex { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 10px 0; overflow: hidden; }
.ex .strip { align-self: stretch; display: flex; flex-direction: column; margin: -10px 0; }
.ex .strip i { flex: 1; }
.ex .body { min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.ex .name { font-weight: 600; font-size: 15.5px; }
.ex .meta { font-size: 12.5px; color: var(--muted); }
.ex .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.rec { font-family: var(--font-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.bar { height: 8px; background: var(--surface-2); border-radius: 999px; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 999px; }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; color: var(--muted); font-weight: 600; }

.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
.heat i { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); }
.heat i.on { background: var(--good); }
.heat i.today { outline: 1.5px solid var(--fg); outline-offset: -1.5px; }

.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--fg); opacity: .07; }
.chart .pt { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
.chart .tg { stroke: var(--good); stroke-dasharray: 4 4; stroke-width: 1.5; }

/* Coach chat */
.coach { background: var(--ink); color: var(--on-ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.coach .bubble { background: color-mix(in srgb, var(--on-ink) 10%, transparent); border-radius: 12px 12px 12px 4px; padding: 9px 12px; font-size: 14px; max-width: 92%; }
.coach .bubble.me { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: color-mix(in srgb, var(--on-ink) 22%, transparent); }
.coach textarea { background: color-mix(in srgb, var(--on-ink) 8%, transparent); color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 25%, transparent); min-height: 54px; }
.coach textarea::placeholder { color: color-mix(in srgb, var(--on-ink) 55%, transparent); }
.coach .btn.primary { background: var(--on-ink); color: var(--ink); border-color: var(--on-ink); }
.coach .btn.ghost { color: var(--on-ink); border-color: color-mix(in srgb, var(--on-ink) 30%, transparent); }
.coach .ideas { display: flex; gap: 6px; flex-wrap: wrap; }
.coach .ideas button { background: transparent; border: 1px solid color-mix(in srgb, var(--on-ink) 30%, transparent); color: var(--on-ink); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; text-align: left; }
.sugg { display: flex; flex-direction: column; gap: 6px; }
.sugg label { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.sugg input { width: 18px; height: 18px; accent-color: var(--fg); }
.sugg .why { font-size: 12.5px; color: var(--muted); }

/* Builder / session */
.block { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.block.ss { border-left: 4px solid var(--fg); }
.block .ss-head { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 9px 12px 0; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.block .ss-head .link { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--muted); }
.bitem { padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.bitem + .bitem { border-top: 1px dashed var(--line); }
.tagid { font-family: var(--font-display); font-weight: 700; font-size: 17px; width: 30px; text-align: center; }
.bitem .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bitem .ctl input { width: 60px; text-align: center; padding: 6px; min-height: 34px; }
.moves { display: flex; flex-direction: column; gap: 4px; }
.moves .iconbtn { width: 32px; height: 30px; font-size: 15px; }
.linker { display: flex; justify-content: center; }
.linker button { font-size: 12px; font-weight: 600; border: 1px dashed var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 3px 12px; }
.sets { display: grid; grid-template-columns: 34px 1fr 1fr 44px; gap: 6px 8px; align-items: center; padding: 0 12px 12px; }
.sets .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; }
.sets input { text-align: center; padding: 7px 4px; min-height: 42px; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
.sets .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: center; }
.tick { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); }
.tick svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 3; fill: none; opacity: .25; }
.tick.on { background: var(--good); border-color: var(--good); color: #fff; }
.tick.on svg { opacity: 1; }
.sets .done input { opacity: .6; }
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 31; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 8px 8px 8px 16px; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); white-space: nowrap; }
.timer .num { font-size: 22px; font-weight: 700; min-width: 50px; }
.timer button { background: color-mix(in srgb, var(--on-ink) 14%, transparent); color: var(--on-ink); border: 0; border-radius: 999px; padding: 6px 10px; font-weight: 600; font-size: 13px; }

/* Programs */
.phases { display: flex; gap: 3px; }
.phases > div { flex: var(--w); min-width: 0; }
.phases .seg-bar { height: 10px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.phases .seg-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.phases .pl { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phases .cur .pl { color: var(--fg); font-weight: 600; }
.progcard { cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.cat { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.mix { display: flex; height: 6px; border-radius: 4px; overflow: hidden; }
.dayex { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.dayex div { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; font-size: 14px; align-items: baseline; }
.dayex .ssl { font-family: var(--font-display); font-weight: 700; color: var(--muted); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.tree { display: flex; flex-direction: column; gap: 10px; }
.tree .g { display: flex; flex-direction: column; gap: 6px; }
.tree .s { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--on-ink); padding: 9px 16px; border-radius: 999px; z-index: 60; font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 22px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.list-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.list-row:first-child { border-top: 0; }
.goal { display: flex; flex-direction: column; gap: 8px; }
.goal + .goal { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist td, table.hist th { padding: 7px 6px; border-top: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
table.hist th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
.tablewrap { overflow-x: auto; }
details summary { cursor: pointer; }
.bmrow { display: flex; gap: 10px; justify-content: center; }
.bmv { margin: 0; flex: 1; max-width: 220px; min-width: 0; text-align: center; }
.bodymap { width: 100%; height: auto; max-height: 230px; display: block; }
.bodymap .sil { fill: var(--surface-2); }
.bodymap .mu { fill: color-mix(in srgb, var(--fg) 9%, var(--surface-2)); stroke: var(--surface); stroke-width: .8; }
.bodymap .hl { stroke: var(--surface); stroke-width: .8; }
.bmv figcaption, .mv figcaption { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mvrow { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 8px; }
.mvrow.one { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto; width: 100%; }
.mv { margin: 0; text-align: center; min-width: 0; }
.mv svg { width: 100%; height: auto; display: block; }
.mv .bone { stroke: var(--fg); stroke-width: 5; stroke-linecap: round; }
.mv .bone.far { opacity: .35; }
.mv .headc { fill: var(--fg); }
.mv .floor { stroke: var(--line); stroke-width: 2; }
.mv .pr { fill: var(--line); } .mv .pr-l { stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
.mv .plate { fill: var(--surface); stroke: var(--fg); stroke-width: 2.5; } .mv .hub { fill: var(--fg); }
.mv .cable { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
.mvarrow { width: 22px; height: 22px; stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
ol.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
ol.steps li::marker { font-family: var(--font-display); font-weight: 700; }
ul.cues { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
ul.cues.bad li::marker { color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="plate" aria-hidden="true"></span>Duolifto</div>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <span class="sync" id="sync"><i></i><span>This device</span></span>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
  </header>

es together at the top.","Lower the weight slowly until your arms are straight."],"cues":["Flat back, chest proud","Lead with your elbows","Squeeze shoulder blades"],"mistakes":["Using hip swing to yank the weight","Rounding your lower back"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_bent"},"chest-supported-t-bar-row":{"setup":"Set the pad so your chest rests on it, feet on the platform, and grip the handles with arms straight.","steps":["Keep your chest firmly pressed against the pad.","Pull the handles toward your lower ribs, elbows close.","Squeeze your shoulder blades together at the top.","Lower slowly until your arms are straight."],"cues":["Chest stays on the pad","Lead with your elbows","Squeeze shoulder blades"],"mistakes":["Lifting your chest off the pad","Shrugging your shoulders up"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_bent"},"single-arm-dumbbell-row":{"setup":"Place one hand and the same-side knee on a bench, other foot on the floor, holding a dumbbell with a flat back.","steps":["Let the dumbbell hang with your arm straight and back flat.","Pull the dumbbell toward your hip, elbow close to your body.","Squeeze your shoulder blade back at the top.","Lower slowly until your arm is straight."],"cues":["Back flat, hips square","Pull toward your hip","Do not twist your torso"],"mistakes":["Twisting your torso to lift the weight","Pulling to your chest, shrugging up"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_bent"},"chest-supported-dumbbell-row":{"setup":"Lie face down on an incline bench set to 30-45 degrees, holding a dumbbell in each hand with arms straight.","steps":["Keep your chest pressed against the bench.","Pull both dumbbells toward your hips, elbows close.","Squeeze your shoulder blades together at the top.","Lower slowly until your arms are straight."],"cues":["Chest stays on the bench","Lead with your elbows","Squeeze shoulder blades"],"mistakes":["Lifting your chest off the bench","Shrugging your shoulders up"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_bent"},"meadows-row":{"setup":"Stand side-on to a landmine bar, staggered stance, hinge forward and grip the thick end of the bar with the near hand.","steps":["Hinge forward with a flat back, free hand on your knee for support.","Pull the bar end up toward your hip, elbow high.","Squeeze your lat and shoulder blade at the top.","Lower slowly until your arm is straight."],"cues":["Flat back, hips back","Elbow drives to the ceiling","Control the stretch"],"mistakes":["Twisting your torso to lift","Rounding your lower back"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_bent"},"kroc-row":{"setup":"Stand with a split stance, one hand on a bench or rack for support, holding a heavy dumbbell in the other hand.","steps":["Hinge forward with a flat back and your arm hanging straight.","Pull the dumbbell toward your hip with a slight controlled body movement.","Squeeze your lat at the top.","Lower under control and repeat for high reps."],"cues":["Use straps if grip limits you","Keep body swing small","Flat back, braced core"],"mistakes":["Excessive body swing that rounds your back","Using a weight you cannot control"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_bent"},"seated-cable-row":{"setup":"Sit at a cable row station with feet on the platform, knees slightly bent, and grip the handle with arms straight.","steps":["Sit tall with a flat back and your shoulders relaxed.","Pull the handle toward your lower stomach, elbows close.","Squeeze your shoulder blades together at the end.","Let your arms extend slowly without rounding your back."],"cues":["Chest tall, no rocking","Lead with your elbows","Squeeze shoulder blades"],"mistakes":["Rocking your torso back and forth","Shrugging your shoulders up"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_seated"},"wide-grip-cable-row":{"setup":"Sit at a cable row station with a long bar attachment, feet on the platform, gripping the bar wide with arms straight.","steps":["Sit tall with a flat back and shoulders relaxed.","Pull the bar toward your upper stomach, elbows flaring out.","Squeeze your upper back together at the end.","Let your arms extend slowly without rounding your back."],"cues":["Elbows out wide","Chest tall, no rocking","Squeeze shoulder blades"],"mistakes":["Rocking your torso to pull the weight","Shrugging your shoulders up"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_seated"},"single-arm-cable-row":{"setup":"Sit or stand facing a low cable with a single handle, feet braced, and hold the handle with your arm straight.","steps":["Sit tall with a flat back and a braced core.","Pull the handle toward your hip, elbow close to your body.","Squeeze your shoulder blade back at the end.","Let your arm extend slowly without twisting."],"cues":["Keep your torso square","Pull toward your hip","Slow return"],"mistakes":["Twisting your torso as you pull","Shrugging your shoulder up"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_seated"},"machine-row":{"setup":"Adjust the seat so the handles line up with your mid-chest, and rest your chest against the pad.","steps":["Grip the handles with arms straight and chest on the pad.","Pull the handles toward your body, elbows close.","Squeeze your shoulder blades together at the end.","Return slowly until your arms are straight."],"cues":["Chest stays on the pad","Lead with your elbows","Squeeze shoulder blades"],"mistakes":["Shrugging your shoulders up","Letting the weight stack crash down"],"breathing":"Breathe out as you pull the weight, in as you lower it.","diagram":"row_seated"},"inverted-row":{"setup":"Set a bar at waist height, lie underneath it, and grip it lldown"},"close-grip-lat-pulldown":{"setup":"Sit at the pulldown machine, lock your thighs under the pad, and grip a close V-handle or narrow bar.","steps":["Sit tall with a slight lean back and your chest up.","Pull the handle down to your upper chest, elbows close to your sides.","Squeeze your lats at the bottom.","Let the handle rise slowly until your arms are straight."],"cues":["Chest up to meet the handle","Elbows drive down and in","Slow return"],"mistakes":["Leaning far back to heave the weight","Shrugging your shoulders up"],"breathing":"Breathe out as you pull the bar down, in as you return.","diagram":"pulldown"},"single-arm-lat-pulldown":{"setup":"Sit at a cable station with a single handle on the high pulley and your thighs secured under the pads.","steps":["Grab the handle with one hand and lean back slightly with a tall chest.","Pull your elbow down and in toward your hip until your hand reaches shoulder level.","Pause, then let your arm rise slowly until your lat is fully stretched.","Finish all reps, then switch arms."],"cues":["Lead with the elbow","Chest up, shoulders down","Control the way up"],"mistakes":["Leaning back and swinging to pull the weight","Shrugging the shoulder up toward your ear"],"breathing":"Breathe out as you pull down, in as the arm rises.","diagram":"pulldown"},"straight-arm-pulldown":{"setup":"Stand facing a high cable with a straight bar or rope, hips slightly back and a small bend in the knees.","steps":["Hold the bar at shoulder height with arms nearly straight and a flat back.","Keeping arms almost straight, sweep the bar down in an arc to your thighs.","Squeeze your lats at the bottom for a second.","Let the bar rise slowly until you feel a stretch under your armpits."],"cues":["Think of sweeping, not pushing","Keep the elbow bend fixed","Ribs down, back flat"],"mistakes":["Bending the elbows and turning it into a triceps pushdown","Using body momentum to move the weight"],"breathing":"Breathe out as the bar sweeps down, in as it rises.","diagram":"lying_ext"},"machine-pullover":{"setup":"Sit in the pullover machine, adjust the seat so your shoulders line up with the pivot, and rest your elbows on the pads.","steps":["Sit back with your upper back against the pad and grip the handles or pads.","Drive your elbows down and forward in an arc until the bar nears your waist.","Squeeze your lats briefly at the bottom.","Return slowly to the start for a full stretch overhead."],"cues":["Push through the elbows","Keep ribs down","Slow stretch at the top"],"mistakes":["Arching the lower back at the stretched position","Letting the weight stack slam at the top"],"breathing":"Breathe out as you pull down, in as you return.","diagram":"lying_ext"},"face-pull":{"setup":"Set a rope on a cable at about face height, grab each end with palms facing in, and step back until the cable is taut.","steps":["Stand tall with arms straight, feet shoulder-width, and a slight lean back.","Pull the rope toward your face, splitting the ends apart beside your ears.","Keep elbows high, squeeze your shoulder blades, and pause.","Return slowly until your arms are straight again."],"cues":["Elbows high and wide","Pull the rope apart","Light weight, clean reps"],"mistakes":["Going too heavy and leaning back to yank it","Letting elbows drop so it becomes a row"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"row_seated"},"barbell-shrug":{"setup":"Stand holding a barbell in front of your thighs with an overhand grip just outside your hips.","steps":["Stand tall with arms straight and shoulders relaxed.","Lift your shoulders straight up toward your ears as high as you can.","Hold for a second at the top.","Lower slowly until your shoulders are fully relaxed."],"cues":["Shoulders straight up","Keep arms long","Pause at the top"],"mistakes":["Rolling the shoulders in circles","Bending the elbows to help lift the bar"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"shrug"},"dumbbell-shrug":{"setup":"Stand holding a dumbbell in each hand at your sides, palms facing your body.","steps":["Stand tall with arms straight and chest up.","Raise your shoulders straight up toward your ears.","Hold for a second at the top.","Lower slowly until your shoulders fully drop."],"cues":["Straight up, not forward","Keep arms long","Neck relaxed"],"mistakes":["Rolling the shoulders","Using a weight so heavy the range is tiny"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"shrug"},"trap-bar-shrug":{"setup":"Stand inside a trap bar and lift it using the handles with a flat back, then stand tall holding it at your sides.","steps":["Stand tall with the trap bar at your sides, arms straight.","Raise your shoulders straight up toward your ears.","Pause for a second at the top.","Lower slowly to a full shoulder drop."],"cues":["Stand tall, chest up","Shoulders straight up","Control the lowering"],"mistakes":["Bending the elbows to lift the weight","Leaning forward or back during the rep"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"shrug"},"prone-y-raise":{"setup":"Lie face down on a bench set at a slight incline or on the floor, holding light dumbbells with arms hanging down.","steps":["Lie face down with your forehead off the bench and arms hanging.","Raise both arms forward and up in a Y shape, thumbs pointing up.","Pause when your arms are in line with your body.","Lower slowly back to the start."],"cues":["Thumbs up, arms in a Y","Squeeze low shoulder blades","Go light and slow"],"mistakes":["Using heavy weights and swinging the arms","Lifting the head or arching the lower back"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"rear_fly"},"back-extension":{"setup":"Set up on a back extension bench with your hips just over the pad and your heels hooked under the rollers.","steps":["Cross your arms on your chest and start with your body in a straight line.", ing the lower back"],"breathing":"Breathe in and brace before pressing, out at lockout.","diagram":"overhead_press"},"seated-barbell-shoulder-press":{"setup":"Sit on a bench with back support set upright and a barbell racked at about upper chest height.","steps":["Unrack the bar with hands just outside shoulder width and brace your core.","Press the bar straight up until your arms are fully extended.","Pause briefly overhead.","Lower the bar under control to your upper chest."],"cues":["Back against the pad","Press in a straight line","Control the lowering"],"mistakes":["Over-arching the back to push the bar up","Lowering the bar too fast to the chest"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"push-press":{"setup":"Stand with a barbell racked on your front shoulders, hands just outside shoulders, and feet hip-width.","steps":["Unrack the bar and keep elbows slightly in front of the bar.","Dip a few centimetres by bending your knees, keeping your torso upright.","Drive up through your legs and press the bar overhead in one motion.","Lock out, then lower the bar to your shoulders and absorb with the knees."],"cues":["Dip straight down","Legs start, arms finish","Lock out overhead"],"mistakes":["Leaning back instead of dipping straight down","Pausing between the leg drive and the press"],"breathing":"Breathe in at the top, brace, then out at lockout.","diagram":"overhead_press"},"behind-the-neck-press":{"setup":"Sit or stand with a barbell resting on your upper back and hands wide enough that forearms stay vertical.","steps":["Set the bar on your upper traps and brace your core with your head neutral.","Press the bar straight up until your arms are locked out.","Lower the bar only to ear level, not onto your neck.","Use light weights and stop if your shoulders feel pinched."],"cues":["Only lower to ear level","Go light, stay controlled","Stop if shoulders pinch"],"mistakes":["Lowering the bar too far and straining the shoulders","Using a grip that is too narrow"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"seated-dumbbell-shoulder-press":{"setup":"Sit on an upright bench holding a dumbbell at each shoulder with palms facing forward.","steps":["Keep your back on the pad and brace your core.","Press the dumbbells up until your arms are straight above your shoulders.","Pause briefly at the top without clanging the weights.","Lower slowly to shoulder level."],"cues":["Wrists over elbows","Press up and slightly in","Control the lowering"],"mistakes":["Arching the lower back off the pad","Lowering the dumbbells too fast or too low"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"standing-dumbbell-shoulder-press":{"setup":"Stand with feet hip-width holding a dumbbell at each shoulder, palms facing forward.","steps":["Squeeze your glutes and brace your abs.","Press the dumbbells straight up until your arms are straight.","Pause briefly at the top.","Lower the dumbbells slowly back to your shoulders."],"cues":["Glutes tight, ribs down","Do not lean back","Press straight up"],"mistakes":["Leaning back and over-arching the lower back","Using leg drive when you want a strict press"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"arnold-press":{"setup":"Sit on an upright bench holding dumbbells at chest height with palms facing you.","steps":["Start with elbows in front of you and palms facing your body.","Press the dumbbells up while rotating your palms to face forward.","Finish with arms straight overhead.","Reverse the rotation as you lower back to your chest."],"cues":["Rotate smoothly as you press","Keep core braced","Slow and controlled"],"mistakes":["Rushing the rotation with swinging momentum","Arching the lower back at the top"],"breathing":"Breathe out as you press, in as you lower.","diagram":"overhead_press"},"single-arm-dumbbell-press":{"setup":"Stand or sit holding one dumbbell at your shoulder, with your free hand on your hip or a support.","steps":["Brace your core and keep your ribs down.","Press the dumbbell straight up until your arm is straight.","Pause briefly overhead.","Lower under control to your shoulder, then switch arms."],"cues":["Stay tall, no side lean","Brace against the weight","Press straight up"],"mistakes":["Leaning sideways to push the weight up","Letting the elbow flare far behind the body"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"machine-shoulder-press":{"setup":"Sit in the machine with your back against the pad and adjust the seat so the handles are at shoulder height.","steps":["Grip the handles and keep your back against the pad.","Press the handles up until your arms are nearly straight.","Pause briefly at the top.","Lower slowly until your hands are near shoulder height."],"cues":["Back flat on the pad","Do not lock elbows hard","Slow lowering"],"mistakes":["Setting the seat too low or too high","Shrugging the shoulders up to your ears"],"breathing":"Breathe out as you press, in as you lower.","diagram":"overhead_press"},"smith-machine-shoulder-press":{"setup":"Sit on a bench inside a Smith machine with the bar at about chin height and feet flat on the floor.","steps":["Grip the bar just outside shoulder width and unhook it.","Press the bar straight up until your arms are straight.","Pause briefly at the top.","Lower to chin level, then rehook the bar when finished."],"cues":["Forearms stay vertical","Back against the bench","Control the lowering"],"mistakes":["Placing the bench too far forward or back","Bouncing the bar off your chest"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"z-press":{"setup":"Sit on the floor with legs straight out in front of you and a barbell racked or held at your shoulders.","steps":["Sit tall with your legs wide and the bar at your upper chest.","Brace your abs and keep your torso upright.","Press the bar straight up until your arms are locked out.","Lower under control back to your upper chest."],"cues":["Sit tall, ribs down","Squeeze glutes","Press in a straight line"],"mistakes":["Leaning back to push the bar up","Rounding the lower back while seated"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"pike-push-up":{"setup":"Start in a pike position with hands shoulder-width apart, feet back, and hips high so your body makes an upside-down V.","steps":["Walk your feet toward your hands so your hips are high.","Bend your elbows to lower the top of your head toward the floor.","Stop before your head touches down.","Press back up until your arms are straight."],"cues":["Hips high, head between arms","Elbows about 45 degrees","Controlled lowering"],"mistakes":["Letting the elbows flare wide","Dropping the hips and doing a regular push-up"],"breathing":"Breathe in as you lower, out as you push.","diagram":"pushup"},"handstand-push-up":{"setup":"Kick up into a handstand with your back or chest facing a wall, hands shoulder-width, on a mat.","steps":["Brace your abs and glutes in a stable handstand against the wall.","Lower your head slowly toward the floor with elbows about 45 degrees.","Lightly touch your head to a pad or the floor.","Press back up until your arms are straight. Use a spotter if you are new."],"cues":["Squeeze glutes and abs","Elbows at 45 degrees","Lower slowly"],"mistakes":["Dropping fast and bouncing off the head","Arching the back heavily against the wall"],"breathing":"Breathe in as you lower, out as you press.","diagram":"overhead_press"},"dumbbell-lateral-raise":{"setup":"Stand holding a dumbbell in each hand at your sides with a slight bend in the elbows.","steps":["Stand tall with your chest up and core braced.","Raise your arms out to the sides until they reach shoulder height.","Pause briefly with your elbows slightly higher than your hands.","Lower slowly back to your sides."],"cues":["Lead with the elbows","Stop at shoulder height","Slow lowering"],"mistakes":["Swinging the body to lift the weights","Shrugging shoulders up toward the ears"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"lateral_raise"},"cable-lateral-raise":{"setup":"Stand sideways to a low cable with the handle in the hand farthest from the machine.","steps":["Hold the handle across your body with a slight elbow bend.","Raise your arm out to the side until it reaches shoulder height.","Pause briefly at the top.","Lower slowly back across your body."],"cues":["Lead with the elbow","Keep your torso still","Smooth tension all the way"],"mistakes":["Leaning away and using body swing","Raising the hand above shoulder height"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"lateral_raise"},"machine-lateral-raise":{"setup":"Sit in the lateral raise machine with your arms against the pads and the seat set so the pivot lines up with your shoulders.","steps":["Sit tall with your back against the pad and elbows resting on the arm pads.","Raise your arms out to the sides until they reach shoulder height.","Pause briefly at the top.","Lower slowly back to the start."],"cues":["Push with the elbows","Do not shrug","Slow lowering"],"mistakes":["Setting the seat so the pivot is not at your shoulder","Using momentum and jerking the weight"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"lateral_raise"},"lean-away-lateral-raise":{"setup":"Stand holding a dumbbell in one hand and grip an upright or rack with the other, leaning your body away from it.","steps":["Hold the support and lean away with your body in a straight line.","Raise the free arm out to the side to shoulder height.","Pause briefly at the top.","Lower slowly. Finish all reps, then switch arms."],"cues":["Lean as a straight line","Lead with the elbow","Control the lowering"],"mistakes":["Bending at the waist rather than leaning as one piece","Using a weight that is too heavy"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"lateral_raise"},"upright-row":{"setup":"Stand holding a barbell in front of your thighs with an overhand grip, hands about shoulder-width apart.","steps":["Stand tall and brace your core.","Pull the bar up along your body, leading with your elbows.","Stop when your elbows reach about shoulder height.","Lower slowly. Stop if your shoulders pinch."],"cues":["Elbows lead the bar","Stop at shoulder height","Keep the bar close"],"mistakes":["Pulling the bar higher than the chest","Using a narrow grip that irritates the shoulders"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"shrug"},"cable-upright-row":{"setup":"Stand facing a low cable with a straight bar or rope attached, holding it in front of your thighs.","steps":["Stand tall with arms straight and core braced.","Pull the handle up along your body, leading with your elbows.","Stop when your elbows reach about shoulder height.","Lower slowly until your arms are straight."],"cues":["Elbows lead the way","Stop at shoulder height","Keep it close to the body"],"mistakes":["Pulling the handle too high","Leaning back to jerk the weight up"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"shrug"},"dumbbell-front-raise":{"setup":"Stand holding a dumbbell in each hand in front of your thighs with palms facing your body.","steps":["Brace your core and keep a slight bend in your elbows.","Raise one or both dumbbells in front of you to shoulder height.","Pause briefly at the top.","Lower slowly back to your thighs."],"cues":["Stop at shoulder height","Keep your torso still","Slow lowering"],"mistakes":["Swinging the weights using your back","Raising the weights above shoulder height"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"front_raise"},"plate-front-raise":{"setup":"Stand holding a weight plate with both hands at the 3 and 9 o'clock positions in front of your thighs.","steps":["Brace your core and keep a slight bend in your elbows.","Raise the plate in front of you to shoulder height.","Pause briefly at the top.","Lower slowly back to your thighs."],"cues":["Arms nearly straight","Stop at shoulder height","Ribs down"],"mistakes":["Leaning back and swinging the plate up","Gripping the plate too heavy for your shoulders"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"front_raise"},"cable-front-raise":{"setup":"Stand facing away from a low cable with the handle in one hand, between your legs, and step forward to tension the cable.","steps":["Brace your core and hold the handle at your thigh with a slight elbow bend.","Raise your arm straight in front to shoulder height.","Pause briefly at the top.","Lower slowly. Finish all reps, then switch arms."],"cues":["Stop at shoulder height","Do not lean back","Slow lowering"],"mistakes":["Using body swing to move the handle","Raising the arm too high"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"front_raise"},"rear-delt-fly-dumbbell":{"setup":"Stand holding light dumbbells and hinge forward at the hips with a flat back, arms hanging down.","steps":["Hinge forward until your torso is near parallel to the floor.","Raise the dumbbells out to your sides with a slight elbow bend.","Squeeze your shoulder blades at the top.","Lower slowly back to the start."],"cues":["Lead with the elbows","Flat back, neck neutral","Light weights, slow reps"],"mistakes":["Using momentum and swinging the torso","Pulling the weights with the traps and shrugging"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"rear_fly"},"reverse-pec-deck":{"setup":"Sit facing the pad on a pec deck machine, chest against it, with handles at arm's length and the seat set to shoulder height.","steps":["Grab the handles with a slight elbow bend and keep your chest on the pad.","Sweep your arms out and back in a wide arc.","Squeeze your rear shoulders at the end.","Return slowly under control."],"cues":["Chest on the pad","Lead with the elbows","Do not shrug"],"mistakes":["Pulling back with the arms and overusing the traps","Letting the weights slam together"],"breathing":"Breathe out as you open, in as you return.","diagram":"rear_fly"},"cable-rear-delt-fly":{"setup":"Stand between two high cables, holding the opposite handles in each hand, with arms crossed in front of you.","steps":["Stand with a slight bend in the knees and hold the opposite handles.","Pull your arms apart and out to the sides at shoulder height.","Squeeze your rear shoulders at the end.","Return slowly to the crossed position."],"cues":["Lead with the elbows","Keep arms at shoulder height","Slow return"],"mistakes":["Using body momentum to jerk the handles","Pulling too low and turning it into a row"],"breathing":"Breathe out as you open, in as you return.","diagram":"rear_fly"},"band-pull-apart":{"setup":"Stand tall holding a resistance band in front of you at shoulder height, hands shoulder-width apart.","steps":["Hold the band with straight arms in front of your chest.","Pull the band apart by moving your hands out to the sides.","Squeeze your shoulder blades together at the end.","Return slowly with control."],"cues":["Squeeze shoulder blades","Arms straight, chest up","Slow return"],"mistakes":["Shrugging shoulders up toward the ears","Leaning back to cheat the pull"],"breathing":"Breathe out as you pull apart, in as you return.","diagram":"rear_fly"},"external-rotation-cable":{"setup":"Stand sideways to a cable at elbow height, holding the handle with the hand farthest from the machine and your elbow tucked to your side.","steps":["Tuck a small towel between your elbow and ribs.","Bend your elbow to 90 degrees with the handle across your belly.","Rotate your forearm outward, away from your belly, keeping the elbow in place.","Return slowly under control. Use light weight."],"cues":["Elbow pinned to your side","Move only the forearm","Light and slow"],"mistakes":["Letting the elbow drift away from the side","Using too heavy a weight and twisting the torso"],"breathing":"Breathe out as you rotate out, in as you return.","diagram":"rear_fly"},"side-lying-external-rotation":{"setup":"Lie on your side with a light dumbbell in your top hand and your elbow bent to 90 degrees against your ribs.","steps":["Place a rolled towel between your elbow and ribs.","Hold the dumbbell with the forearm resting across your belly.","Rotate your forearm upward toward the ceiling, keeping the elbow in place.","Lower slowly under control. Use very light weight."],"cues":["Elbow pinned to your side","Move only the forearm","Very light weight"],"mistakes":["Lifting the elbow away from the body","Using heavy weights and jerking"],"breathing":"Breathe out as you rotate up, in as you lower.","diagram":"rear_fly"},"internal-rotation-cable":{"setup":"Stand sideways to a cable at elbow height, holding the handle with the hand nearest the machine and your elbow tucked to your side.","steps":["Tuck a small towel between your elbow and ribs.","Bend your elbow to 90 degrees with the forearm pointing outward.","Rotate your forearm inward across your belly, keeping the elbow in place.","Return slowly under control. Use light weight."],"cues":["Elbow pinned to your side","Move only the forearm","Light and slow"],"mistakes":["Letting the elbow drift away from the side","Rotating the whole torso instead of the arm"],"breathing":"Breathe out as you rotate in, in as you return.","diagram":"rear_fly"},"cuban-press":{"setup":"Stand holding light dumbbells in front of your thighs with palms facing your body.","steps":["Pull the dumbbells up to chest height with elbows high, as in an upright row.","Rotate your forearms upward until your hands are above your elbows.","Press the dumbbells overhead until your arms are straight.","Reverse the steps to lower. Use very light weights."],"cues":["Keep elbows at shoulder height","Smooth rotation","Very light weights"],"mistakes":["Using heavy weights and rushing the rotation","Letting the elbows drop during the rotation"],"breathing":"Breathe out as you press, in as you lower.","diagram":"overhead_press"},"full-can-raise":{"setup":"Stand holding light dumbbells at your sides with thumbs pointing up, like holding a full can.","steps":["Stand tall with a slight bend in your elbows.","Raise your arms diagonally forward at about 30 degrees from straight ahead, thumbs up.","Stop at shoulder height and pause.","Lower slowly. Use light weights."],"cues":["Thumbs up the whole time","Stop at shoulder height","Light and controlled"],"mistakes":["Shrugging the shoulders during the raise","Swinging the weights with the lower back"],"breathing":"Breathe out as you raise, in as you lower.","diagram":"front_raise"},"overhead-plate-halo":{"setup":"Stand holding a weight plate with both hands at chest height in front of you, feet shoulder-width apart.","steps":["Brace your abs and stand tall with the plate close to your chin.","Circle the plate slowly around your head, keeping it close.","Complete the circle back to the front.","Reverse direction on the next rep."],"cues":["Keep ribs down","Plate close to the head","Slow, smooth circles"],"mistakes":["Leaning back and arching the lower back","Using a plate so heavy it pulls you off balance"],"breathing":"Breathe steadily throughout; do not hold your breath.","diagram":"rotation"},"barbell-curl":{"setup":"Stand holding a barbell with an underhand grip at shoulder width, arms hanging in front of your thighs.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the bar up toward your shoulders without moving your elbows forward.","Squeeze your biceps at the top.","Lower the bar slowly until your arms are straight."],"cues":["Elbows stay at your sides","Squeeze at the top","Slow lowering"],"mistakes":["Swinging the body to lift the bar","Letting the elbows drift forward"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"ez-bar-curl":{"setup":"Stand holding an EZ-bar on its angled grips with an underhand grip and arms hanging in front of your thighs.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the bar up toward your shoulders without moving your elbows.","Squeeze your biceps at the top.","Lower the bar slowly until your arms are straight."],"cues":["Elbows stay at your sides","Squeeze at the top","Slow lowering"],"mistakes":["Swinging the torso to get the bar up","Dropping the weight fast on the way down"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"dumbbell-curl":{"setup":"Stand holding a dumbbell in each hand at your sides with palms facing forward.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the dumbbells up toward your shoulders.","Squeeze your biceps at the top.","Lower slowly until your arms are straight."],"cues":["Elbows stay at your sides","Squeeze at the top","Slow lowering"],"mistakes":["Swinging the body to lift the weights","Letting the elbows drift forward"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"incline-dumbbell-curl":{"setup":"Sit back on an incline bench set to about 45 degrees, holding dumbbells with arms hanging straight down behind your torso.","steps":["Keep your back and head against the bench.","Curl the dumbbells up toward your shoulders without moving your upper arms.","Squeeze your biceps at the top.","Lower slowly until your arms are straight for a full stretch."],"cues":["Upper arms stay back","Feel the stretch at the bottom","Slow lowering"],"mistakes":["Letting the elbows swing forward","Using a heavy weight that cuts the range short"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"hammer-curl":{"setup":"Stand holding a dumbbell in each hand at your sides with palms facing your thighs.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the dumbbells up with palms facing each other, as if holding hammers.","Squeeze at the top.","Lower slowly until your arms are straight."],"cues":["Palms face each other","Elbows stay at your sides","Slow lowering"],"mistakes":["Swinging the body to lift the weights","Rotating the wrists during the rep"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"cross-body-hammer-curl":{"setup":"Stand holding a dumbbell in each hand at your sides with palms facing your thighs.","steps":["Stand tall with your elbows tucked in.","Curl one dumbbell diagonally across your body toward the opposite shoulder, palm facing in.","Squeeze at the top.","Lower slowly and alternate arms."],"cues":["Palm faces in","Keep the elbow at your side","Slow lowering"],"mistakes":["Swinging the torso to get the dumbbell up","Letting the elbow drift forward"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"preacher-curl":{"setup":"Sit at a preacher bench with your upper arms resting on the pad and an EZ-bar held with an underhand grip.","steps":["Rest your upper arms flat on the pad and hold the bar.","Curl the bar up toward your shoulders.","Squeeze your biceps at the top.","Lower slowly until your arms are almost fully straight."],"cues":["Upper arms stay on the pad","Slow lowering","Do not fully lock the elbows"],"mistakes":["Dropping the bar fast at the bottom, risking the elbow","Lifting the elbows or hips off the bench"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"machine-preacher-curl":{"setup":"Sit at the preacher curl machine with your upper arms on the pad and the seat set so the pad is at your armpits.","steps":["Rest your upper arms on the pad and grip the handles.","Curl the handles up toward your shoulders.","Squeeze your biceps at the top.","Lower slowly until your arms are almost straight."],"cues":["Upper arms stay on the pad","Slow lowering","Do not lock the elbows hard"],"mistakes":["Lifting the elbows off the pad","Letting the weights drop at the bottom"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"spider-curl":{"setup":"Lie chest down on an incline bench set to about 45 degrees with dumbbells hanging straight down.","steps":["Rest your chest on the bench with arms hanging straight down.","Curl the dumbbells up toward your shoulders.","Squeeze your biceps at the top.","Lower slowly until your arms are straight."],"cues":["Upper arms hang straight down","Squeeze at the top","Slow lowering"],"mistakes":["Swinging the arms back to get momentum","Lifting the chest off the bench"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"concentration-curl":{"setup":"Sit on a bench with your feet wide, holding a dumbbell and resting your elbow against the inside of your thigh.","steps":["Rest your elbow on your inner thigh with the arm hanging straight.","Curl the dumbbell up toward your shoulder.","Squeeze your biceps at the top.","Lower slowly until your arm is straight. Switch arms."],"cues":["Elbow stays on the thigh","Squeeze at the top","Slow lowering"],"mistakes":["Leaning back and swinging the weight","Lifting the elbow off the thigh"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"cable-curl":{"setup":"Stand facing a low cable with a straight or EZ-bar attached, holding it with an underhand grip.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the bar up toward your shoulders.","Squeeze your biceps at the top.","Lower slowly until your arms are straight."],"cues":["Elbows stay at your sides","Constant tension","Slow lowering"],"mistakes":["Leaning back and swinging the weight","Letting the elbows drift forward"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"bayesian-cable-curl":{"setup":"Stand facing away from a low cable, holding the handle in one hand with your arm behind your body and a staggered stance.","steps":["Step forward to put tension on the cable with your arm behind you.","Keep your elbow slightly behind your body.","Curl the handle up toward your shoulder.","Lower slowly for a full stretch. Switch arms."],"cues":["Elbow stays behind the body","Stretch at the bottom","Slow lowering"],"mistakes":["Letting the elbow swing forward","Leaning forward to get the handle up"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"reverse-curl":{"setup":"Stand holding an EZ-bar with an overhand grip, hands shoulder-width apart, arms in front of your thighs.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the bar up toward your shoulders, keeping your wrists straight.","Squeeze at the top.","Lower slowly until your arms are straight."],"cues":["Wrists stay straight","Elbows stay at your sides","Go light"],"mistakes":["Letting the wrists bend back","Swinging the body to lift the bar"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"zottman-curl":{"setup":"Stand holding a dumbbell in each hand at your sides with palms facing forward.","steps":["Stand tall with elbows tucked beside your ribs.","Curl the dumbbells up with palms facing forward.","Rotate your palms to face down at the top.","Lower slowly with palms down, then rotate back to start."],"cues":["Slow rotation at the top","Elbows stay at your sides","Slow lowering"],"mistakes":["Swinging the body to lift the weights","Using a heavy weight that you cannot lower slowly"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"drag-curl":{"setup":"Stand holding a barbell with an underhand grip at shoulder width, arms hanging in front of your thighs.","steps":["Stand tall and keep the bar close to your body.","Pull your elbows back and curl the bar up, dragging it along your torso.","Squeeze your biceps at the top.","Lower slowly along the same path."],"cues":["Bar slides up your body","Elbows go back","Slow lowering"],"mistakes":["Letting the bar swing away from the body","Leaning back to lift the bar"],"breathing":"Breathe out as you lift or pull, and in as you lower.","diagram":"curl"},"chin-up-hold":{"setup":"Stand under a pull-up bar and grip it with palms facing you, hands shoulder-width apart.","steps":["Use a box or jump to get your chin above the bar.","Hold with elbows bent and chin above the bar.","Keep your shoulders down and core tight.","Lower slowly when you tire. Use a box or band if needed."],"cues":["Chin above the bar","Shoulders down","Core tight"],"mistakes":["Craning the neck to get the chin over","Dropping fast when you tire"],"breathing":"Breathe steadily; do not hold your breath.","diagram":"pullup"},"triceps-pushdown-rope":{"setup":"Stand facing a high cable with a rope attached, holding both ends with palms facing in and elbows at your sides.","steps":["Stand tall with elbows tucked beside your ribs.","Push the rope down until your arms are fully straight.","Spread the rope ends apart at the bottom and squeeze.","Let the rope rise slowly until your forearms are just past parallel."],"cues":["Elbows pinned to sides","Spread the rope at the bottom","Slow return"],"mistakes":["Leaning over the rope and using body weight","Letting the elbows flare out"],"breathing":"Breathe out as you push down, in as you return.","diagram":"pushdown"},"triceps-pushdown-bar":{"setup":"Attach a straight or V-bar to a high pulley and stand close, holding the bar at chest height with elbows by your sides.","steps":["Grip the bar shoulder-width, palms down, and pin your elbows to your ribs.","Press the bar down until your arms are fully straight.","Squeeze your triceps for a moment at the bottom.","Let the bar rise slowly until your forearms are just past parallel."],"cues":["Elbows stay glued to your sides","Keep your chest up and torso still","Control the bar on the way up"],"mistakes":["Leaning over the bar and using body weight","Letting elbows drift forward or flare out"],"breathing":"Breathe out as you push or lift, and in as you return.","diagram":"pushdown"},"single-arm-cable-pushdown":{"setup":"Set a high pulley with a single handle and stand side-on to it, holding the handle with your elbow tucked in.","steps":["Hold the handle with a palm-down or neutral grip, elbow bent to 90 degrees.","Keep your upper arm still and press the handle down until your arm is straight.","Squeeze the triceps briefly at the bottom.","Return slowly until your forearm is just past parallel to the floor."],"cues":["Upper arm stays pinned to your side","Stay tall and do not twist","Smooth, slow return"],"mistakes":["Swinging the shoulder to drive the weight down","Using a weight that makes your elbow drift forward"],"breathing":"Breathe out as you push or lift, and in as you return.","diagram":"pushdown"},"overhead-cable-triceps-extension":{"setup":"Attach a rope to a low or mid pulley, face away from the stack, and hold the rope behind your head with a split stance.","steps":["Grip the rope, raise your elbows beside your ears and lean slightly forward.","Keep your upper arms still and straighten your elbows to press the rope forward and up.","Squeeze your triceps at full extension.","Bend your elbows slowly to return behind your head."],"cues":["Elbows point forward, not flared out","Brace your core, do not arch your back","Feel a deep stretch behind the head"],"mistakes":["Letting elbows flare wide","Arching your lower back as you press"],"breathing":"Breathe in as you lower the rope, out as you extend.","diagram":"overhead_ext"},"overhead-dumbbell-triceps-extension":{"setup":"Sit or stand holding one dumbbell with both hands, pressed overhead with your arms straight.","steps":["Cup the top plate of the dumbbell with both palms and lock your arms overhead.","Keep your elbows pointing forward and bend them to lower the weight behind your head.","Lower until you feel a good stretch in the triceps.","Straighten your arms to press back to the top."],"cues":["Keep elbows close to your ears","Ribs down, core braced","Move only at the elbows"],"mistakes":["Flaring elbows out to the sides","Arching the back to lift a too-heavy weight"],"breathing":"Breathe in as you lower, out as you press up.","diagram":"overhead_ext"},"skull-crusher":{"setup":"Lie on a flat bench holding an EZ-bar over your chest with arms straight and a narrow grip.","steps":["Lie back with feet planted and the bar above your shoulders, arms straight.","Keep your upper arms still and bend your elbows to lower the bar toward your forehead.","Stop just above your forehead or slightly behind your head.","Straighten your elbows to press the bar back up."],"cues":["Upper arms stay vertical and still","Elbows pointed at the ceiling","Lower under control"],"mistakes":["Letting elbows flare and drift wide","Lowering too fast, which stresses the elbows"],"breathing":"Breathe in as you lower, out as you extend.","diagram":"lying_ext"},"dumbbell-skull-crusher":{"setup":"Lie on a flat bench with a dumbbell in each hand, arms straight above your chest, palms facing each other.","steps":["Press the dumbbells up with arms straight and palms facing in.","Keep your upper arms still and bend your elbows to lower the weights beside your head.","Lower until your forearms are about parallel to the floor or slightly past.","Straighten your elbows to return to the start."],"cues":["Only your forearms move","Keep wrists straight and strong","Slow, controlled lowering"],"mistakes":["Using too heavy a weight and swinging the arms","Letting the dumbbells drift toward your face"],"breathing":"Breathe in as you lower, out as you extend.","diagram":"lying_ext"},"jm-press":{"setup":"Lie on a flat bench under a barbell in a rack, with a grip just inside shoulder-width and a spotter if possible.","steps":["Unrack the bar and hold it over your lower chest with arms nearly straight.","Let your elbows bend forward so the bar travels toward your chin or upper chest.","Stop when your forearms are roughly vertical, elbows pointing forward.","Press the bar back up by straightening your elbows."],"cues":["Elbows stay tucked and forward","Bar path is short and controlled","Use a spotter and light weight"],"mistakes":["Going too heavy, which risks dropping the bar on your face","Flaring elbows out like a normal bench press"],"breathing":"Breathe in as you lower, out as you press up.","diagram":"bench_press"},"triceps-kickback":{"setup":"Hold a dumbbell in one hand, hinge forward with a flat back, and rest your other hand on a bench for support.","steps":["Raise your upper arm so it is parallel to your torso, elbow bent to 90 degrees.","Keep the upper arm fixed and straighten your elbow to push the dumbbell back.","Squeeze your triceps at full extension.","Bend your elbow slowly to return."],"cues":["Upper arm stays level with your back","Flat back, neck in line with spine","Squeeze at the top"],"mistakes":["Swinging the weight with momentum","Letting the elbow drop during the rep"],"breathing":"Breathe out as you push or lift, and in as you return.","diagram":"kickback"},"bench-dip":{"setup":"Sit on the edge of a bench with hands beside your hips, fingers forward, and legs out in front.","steps":["Slide your hips off the bench and support yourself on straight arms.","Bend your elbows straight back to lower your body about 90 degrees at the elbows.","Keep your back close to the bench the whole time.","Press through your palms to straighten your arms."],"cues":["Elbows point straight back","Shoulders stay down, away from ears","Keep hips close to the bench"],"mistakes":["Lowering too deep, which strains the shoulders","Flaring elbows out to the sides"],"breathing":"Breathe in as you lower, out as you press up.","diagram":"dip"},"triceps-dip":{"setup":"Grip parallel bars and support yourself with straight arms, body upright, knees bent and feet behind you.","steps":["Start with arms locked out and shoulders pulled down.","Keep your torso fairly upright and elbows tucked as you lower.","Lower until your upper arms are about parallel to the floor.","Press up until your arms are straight."],"cues":["Stay upright to target the triceps","Elbows tucked close to your body","Control the descent"],"mistakes":["Leaning forward, which shifts work to the chest","Dropping too deep and straining the shoulders"],"breathing":"Breathe in as you lower, out as you press up.","diagram":"dip"},"wrist-curl":{"setup":"Sit on a bench with forearms resting on your thighs, palms up, a dumbbell in each hand with wrists hanging past your knees.","steps":["Let the dumbbells roll down to your fingertips.","Curl your fingers closed and lift the weight by bending your wrists up.","Squeeze your forearms at the top.","Lower slowly back to the start."],"cues":["Forearms stay flat on your thighs","Move only at the wrists","Use a light weight, slow tempo"],"mistakes":["Lifting your forearms off your legs","Using too heavy a weight with jerky reps"],"breathing":"Breathe steadily; breathe out as you curl up.","diagram":"curl"},"reverse-wrist-curl":{"setup":"Sit on a bench with forearms on your thighs, palms down, holding light dumbbells with wrists hanging past your knees.","steps":["Start with your wrists bent down and the weights hanging.","Extend your wrists to raise the back of your hands toward the ceiling.","Pause briefly at the top.","Lower slowly to the start."],"cues":["Go light, these muscles are small","Forearms stay pinned down","Slow and controlled"],"mistakes":["Using weight that makes you swing your arms","Cutting the range of motion short"],"breathing":"Breathe steadily; breathe out as you lift.","diagram":"curl"},"behind-the-back-wrist-curl":{"setup":"Stand holding a barbell behind your thighs with an underhand grip, arms straight and hands shoulder-width apart.","steps":["Let the bar roll down to your fingertips.","Curl your fingers shut and lift the bar by bending your wrists.","Squeeze at the top without moving your arms.","Lower the bar slowly back down."],"cues":["Arms stay straight and still","Chest up, shoulders back","Slow on the way down"],"mistakes":["Bending the elbows or swinging the bar","Using a load you cannot hold safely"],"breathing":"Breathe steadily; breathe out as you curl.","diagram":"curl"},"wrist-roller":{"setup":"Stand holding a wrist roller bar with both hands, arms extended in front at shoulder height, weight hanging on the rope.","steps":["Grip the bar overhand with arms straight out in front.","Roll the bar toward you by twisting your wrists until the weight reaches the bar.","Reverse the roll slowly to lower the weight back down.","Rest, then repeat in the other direction if desired."],"cues":["Keep arms level at shoulder height","Use only your wrists and forearms","Lower the weight under control"],"mistakes":["Letting your shoulders and arms sag","Using a weight that is too heavy"],"breathing":"Breathe steadily throughout; do not hold your breath.","diagram":"curl"},"dead-hang":{"setup":"Stand under a pull-up bar and grip it overhand slightly wider than shoulder-width, using a box if needed to reach it.","steps":["Grab the bar and step off so your feet leave the floor.","Hang with arms straight and shoulders gently pulled down.","Hold the position for the target time.","Step down onto a box or lower yourself carefully when done."],"cues":["Squeeze the bar hard","Keep shoulders active, not slack","Stay relaxed and still"],"mistakes":["Letting shoulders shrug up to your ears","Swinging or kipping during the hold"],"breathing":"Breathe slowly and steadily; do not hold your breath.","diagram":"pullup"},"plate-pinch":{"setup":"Stand holding two smooth weight plates stacked together, smooth sides out, pinched between your fingers and thumb.","steps":["Pinch the plates together by their edges with one hand, thumb on one side.","Lift them off the floor and stand tall with your arm by your side.","Hold for the target time.","Lower them under control and rest."],"cues":["Squeeze hard with fingers and thumb","Stand tall, shoulders back","Hold over a mat in case of drops"],"mistakes":["Dropping plates onto your feet","Using plates too heavy to hold safely"],"breathing":"Breathe steadily; do not hold your breath.","diagram":"curl"},"plank":{"setup":"Lie face down, then prop yourself on your forearms with elbows under shoulders and legs straight, toes on the floor.","steps":["Lift your body into one straight line from head to heels.","Tighten your abs and squeeze your glutes.","Look at the floor and keep your neck neutral.","Hold for the target time."],"cues":["Imagine pulling elbows toward your toes","Ribs down, hips level","Squeeze glutes and abs hard"],"mistakes":["Letting the hips sag and arch the lower back","Piking the hips too high"],"breathing":"Breathe slowly and steadily; do not hold your breath.","diagram":"plank"},"side-plank":{"setup":"Lie on your side and prop up on one forearm with elbow under your shoulder and legs stacked or staggered.","steps":["Lift your hips so your body forms a straight line from head to feet.","Keep your top arm on your hip or reach it toward the ceiling.","Hold without letting your hips drop.","Lower, then repeat on the other side."],"cues":["Push the floor away with your forearm","Hips high and stacked","Head in line with your spine"],"mistakes":["Letting the hips sag toward the floor","Rolling the torso forward or backward"],"breathing":"Breathe slowly and steadily; do not hold your breath.","diagram":"plank"},"copenhagen-plank":{"setup":"Set a bench about knee height and lie on your side, forearm on the floor, top leg resting on the bench with your lower leg free.","steps":["Place your top leg on the bench, inner knee or ankle for support.","Lift your hips so your body is in a straight line.","Raise your bottom leg to meet the bench or hover under it.","Hold, then lower and switch sides."],"cues":["Squeeze the top leg into the bench","Hips high, body straight","Start with the knee-support version"],"mistakes":["Starting too advanced and straining the groin","Letting hips drop or rotate forward"],"breathing":"Breathe slowly and steadily; do not hold your breath.","diagram":"plank"},"crunch":{"setup":"Lie on your back with knees bent, feet flat, and hands lightly behind your head or across your chest.","steps":["Brace your abs and curl your ribs toward your hips.","Lift your shoulder blades off the floor, keeping your lower back down.","Squeeze your abs briefly at the top.","Lower slowly without letting your head drop."],"cues":["Short curl, not a full sit-up","Eyes on the ceiling, chin off chest","Don't pull on your neck"],"mistakes":["Yanking your head forward with your hands","Using momentum instead of your abs"],"breathing":"Breathe out as you crunch up, in as you lower.","diagram":"crunch"},"cable-crunch":{"setup":"Kneel facing a high pulley with a rope attached, holding the rope at either side of your head.","steps":["Hold the rope by your ears and sit your hips back over your heels.","Curl your chest toward your hips, rounding your spine.","Squeeze your abs hard at the bottom.","Return slowly to the start without sitting back."],"cues":["Round the spine, do not just bend the hips","Hips stay still","Pull with the abs, not the arms"],"mistakes":["Pulling with the arms and bending at the hips","Using a weight so heavy that form breaks down"],"breathing":"Breathe out as you crunch down, in as you return.","diagram":"crunch"},"machine-crunch":{"setup":"Sit in the ab crunch machine, adjust the seat so the pivot lines up with your waist, and grip the handles.","steps":["Sit tall with feet secured and handles in hand.","Curl your torso forward by contracting your abs.","Squeeze at the bottom for a second.","Return slowly until your abs are stretched, keeping tension."],"cues":["Curl the ribs toward the hips","Keep your arms relaxed","Slow on the return"],"mistakes":["Pushing with the arms or legs","Letting the weight stack slam down"],"breathing":"Breathe out as you crunch, in as you return.","diagram":"crunch"},"decline-sit-up":{"setup":"Lie on a decline bench with your feet secured under the pads and arms crossed on your chest.","steps":["Lie back with knees slightly bent and arms across your chest.","Curl your torso up, bringing your chest toward your thighs.","Pause at the top with your back tall.","Lower slowly until your shoulder blades near the bench."],"cues":["Curl up one vertebra at a time","Stay in control going down","Start with a mild decline"],"mistakes":["Yanking the neck with your hands","Dropping down fast and bouncing at the bottom"],"breathing":"Breathe out as you sit up, in as you lower.","diagram":"crunch"},"hanging-leg-raise":{"setup":"Hang from a pull-up bar with an overhand grip, arms straight, legs together.","steps":["Hang still with your shoulders gently engaged.","Tilt your pelvis up and raise your straight legs in front of you.","Lift to hip height or higher without swinging.","Lower slowly to a controlled hang."],"cues":["Curl your pelvis up, not just the legs","No swinging","Lower slower than you lift"],"mistakes":["Swinging to build momentum","Using only the hip flexors with an arched back"],"breathing":"Breathe out as you raise your legs, in as you lower.","diagram":"leg_raise"},"hanging-knee-raise":{"setup":"Hang from a pull-up bar with an overhand grip, arms straight, legs hanging.","steps":["Hang still with shoulders engaged.","Bend your knees and pull them up toward your chest.","Curl your pelvis up at the top and squeeze your abs.","Lower slowly to a straight hang."],"cues":["Tuck the hips up under you","Keep the swing out of it","Slow lowering"],"mistakes":["Swinging the legs to cheat the rep","Letting your shoulders shrug up"],"breathing":"Breathe out as you raise your legs, in as you lower.","diagram":"leg_raise"},"toes-to-bar":{"setup":"Hang from a pull-up bar with an overhand grip, arms straight, body still.","
